<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="2026-10-01-i">
<title>구마를 안은 행복한 토끼</title>
<link id="siteFavicon" rel="icon" type="image/png" href="combo-favicon-32.png">
<link id="siteAppleIcon" rel="apple-touch-icon" href="combo-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Noto Sans KR',sans-serif; min-height:100vh; }
  .top-banner{
    position:sticky; top:0; z-index:50;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    background:linear-gradient(180deg, #FFF6F8 0%, #FDF1EC 100%);
    border-bottom:1px solid rgba(0,0,0,.06);
    transition:background .5s ease;
  }
  .top-banner[data-mode="smoke"]{
    background:linear-gradient(180deg, #FFF8E8 0%, #FDF2DD 100%);
  }

  /* 미끄러지는 세그먼트 스위처 */
  .switcher{
    position:relative; display:flex; max-width:380px; margin-inline:auto;
    background:rgba(255,255,255,.72); border-radius:999px; padding:5px;
    box-shadow:0 2px 14px rgba(120,80,70,.14), inset 0 0 0 1px rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
  }
  .switcher .thumb{
    position:absolute; top:5px; bottom:5px; left:5px;
    width:calc(50% - 5px); border-radius:999px; z-index:0;
    background:linear-gradient(135deg, #FBD3DC, #F5AFC0);
    box-shadow:0 3px 10px rgba(226,142,164,.42);
    transition:transform .46s cubic-bezier(.5,1.42,.42,1), background .42s ease, box-shadow .42s ease;
  }
  .switcher[data-mode="smoke"] .thumb{
    transform:translateX(100%);
    background:linear-gradient(135deg, #FCDFA4, #F6C46A);
    box-shadow:0 3px 10px rgba(216,166,80,.46);
  }
  .seg{
    position:relative; z-index:1; flex:1; border:0; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px 6px; border-radius:999px;
    font-family:'Gaegu',cursive; font-size:16.5px; font-weight:700;
    color:#A08C86; transition:color .3s ease, transform .2s cubic-bezier(.34,1.4,.64,1);
    -webkit-tap-highlight-color:transparent;
  }
  .seg[aria-selected="true"]{ color:#5A3B38; }
  .seg:active{ transform:scale(.96); }
  .seg:focus-visible{ outline:2px solid #C98BA0; outline-offset:2px; }
  .seg img{
    width:26px; height:26px; border-radius:50%; object-fit:cover; display:block;
    box-shadow:0 1px 4px rgba(0,0,0,.18);
    transition:transform .46s cubic-bezier(.4,1.5,.5,1), filter .3s ease;
    filter:saturate(.55) opacity(.75);
  }
  .seg[aria-selected="true"] img{
    filter:none;
    transform:scale(1.12) rotate(-6deg);
  }
  @media (max-width:360px){
    .seg{ font-size:15px; gap:5px; }
    .seg img{ width:23px; height:23px; }
  }

  .app-panel{ min-height:100vh; }
  .app-panel.enter{ animation:panelIn .42s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(10px) scale(.994); }
    to{ opacity:1; transform:none; }
  }

  /* 전환 시 잠깐 뜨는 아이콘 */
  .splash{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0;
  }
  .splash.show{ animation:splashFade .78s ease both; }
  .splash .glyph{
    width:128px; height:128px; border-radius:28px; display:block;
    object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .splash.show .glyph{ animation:glyphPop .78s cubic-bezier(.3,1.4,.5,1) both; }
  .splash .label{
    position:absolute; bottom:calc(50% - 104px);
    font-family:'Gaegu',cursive; font-size:17px; font-weight:700;
    color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .splash.show .label{ animation:labelFade .78s ease both; }
  @keyframes splashFade{
    0%{ opacity:0; backdrop-filter:blur(0px); background:rgba(20,22,26,0); }
    18%{ opacity:1; backdrop-filter:blur(7px); background:rgba(20,22,26,.46); }
    62%{ opacity:1; backdrop-filter:blur(7px); background:rgba(20,22,26,.46); }
    100%{ opacity:0; backdrop-filter:blur(0px); background:rgba(20,22,26,0); }
  }
  @keyframes glyphPop{
    0%{ transform:scale(.4) rotate(-14deg); opacity:0; }
    30%{ transform:scale(1.14) rotate(3deg); opacity:1; }
    45%{ transform:scale(1) rotate(0deg); }
    70%{ transform:scale(1) rotate(0deg); opacity:1; }
    100%{ transform:scale(1.18); opacity:0; }
  }
  @keyframes labelFade{
    0%{ opacity:0; transform:translateY(8px); }
    28%{ opacity:1; transform:none; }
    68%{ opacity:1; transform:none; }
    100%{ opacity:0; transform:translateY(-4px); }
  }

  /* 카드가 자연스럽게 떠오르도록 */
  #app-leave .card, #app-smoke .card{
    animation:cardRise .34s ease both;
  }
  @keyframes cardRise{
    from{ opacity:0; transform:translateY(7px); }
    to{ opacity:1; transform:none; }
  }
  #app-leave button, #app-smoke button{
    transition:transform .16s cubic-bezier(.34,1.3,.64,1), filter .16s ease;
  }
  #app-leave button:active, #app-smoke button:active{ transform:scale(.96); }

  /* ── 성공 토스트 (체크 그려지는 연출) ── */
  .fx-toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(14px);
    z-index:300; display:flex; align-items:center; gap:10px;
    padding:13px 20px 13px 15px; border-radius:999px;
    background:rgba(32,28,34,.93); color:#fff; font-size:14px; font-weight:600;
    box-shadow:0 8px 28px rgba(0,0,0,.3); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; max-width:calc(100vw - 32px);
  }
  .fx-toast.show{ animation:toastIn 2.6s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes toastIn{
    0%{ opacity:0; transform:translateX(-50%) translateY(16px) scale(.94); }
    9%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    88%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-8px) scale(.98); }
  }
  .fx-toast svg{ width:22px; height:22px; flex-shrink:0; }
  .fx-toast .ring{ stroke:#6FD08C; stroke-width:2.2; fill:none; stroke-dasharray:63; stroke-dashoffset:63; }
  .fx-toast .tick{ stroke:#6FD08C; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:22; stroke-dashoffset:22; }
  .fx-toast.show .ring{ animation:drawRing .5s ease-out .06s forwards; }
  .fx-toast.show .tick{ animation:drawTick .34s ease-out .42s forwards; }
  @keyframes drawRing{ to{ stroke-dashoffset:0; } }
  @keyframes drawTick{ to{ stroke-dashoffset:0; } }
  .fx-toast.warn{ background:rgba(60,32,30,.94); }
  .fx-toast.warn .ring, .fx-toast.warn .tick{ stroke:#F0A868; }

  /* ── 컨페티 ── */
  .fx-confetti{ position:fixed; inset:0; z-index:290; pointer-events:none; overflow:hidden; }
  .fx-confetti i{
    position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
    animation:confFall linear forwards;
  }
  @keyframes confFall{
    0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(102vh) rotate(760deg); opacity:.9; }
  }

  /* ── 숫자 굴러가기 ── */
  .num-roll{ display:inline-block; transition:transform .2s ease; }
  .num-roll.bump{ animation:numBump .5s cubic-bezier(.3,1.5,.5,1); }
  @keyframes numBump{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.22); }
    100%{ transform:scale(1); }
  }

  /* ── 도장: 반동 + 잉크 번짐 ── */
  #app-leave .stamp, #app-smoke .stamp{ animation:stampHit .62s cubic-bezier(.2,1.4,.4,1) both !important; }
  @keyframes stampHit{
    0%{ transform:rotate(-16deg) scale(3); opacity:0; }
    42%{ transform:rotate(-16deg) scale(.82); opacity:1; }
    54%{ transform:rotate(-13deg) scale(1.13); }
    64%{ transform:rotate(-15deg) scale(.95); }
    74%{ transform:rotate(-13deg) scale(1.05); }
    86%{ transform:rotate(-14deg) scale(.99); }
    100%{ transform:rotate(-14deg) scale(1); opacity:1; }
  }
  .stamp-ink{
    position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%;
    transform:translate(-50%,-50%); pointer-events:none;
    border:2px solid currentColor; opacity:.55;
    animation:inkSpread .72s ease-out .24s both;
  }
  @keyframes inkSpread{
    0%{ width:10px; height:10px; opacity:.6; }
    100%{ width:92px; height:92px; opacity:0; }
  }

  /* ── 타이머 ── */
  #app-smoke .timer-num{ transition:color .4s ease; }
  #app-smoke .timer-num.tick{ animation:tickBeat .5s ease-out; }
  @keyframes tickBeat{
    0%{ transform:scale(1); }
    22%{ transform:scale(1.045); }
    100%{ transform:scale(1); }
  }
  #app-smoke .timer-num.urgent{ color:#D96C7A; animation:pulseBeat 1s ease-in-out infinite; }
  @keyframes pulseBeat{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.07); opacity:.82; }
  }

  /* ── 목록 항목 등장 ── */
  #app-leave .card, #app-smoke .card{ animation:cardRise .34s ease both; }

  /* ── 대기 배지 통통 ── */
  .count-pop{ animation:badgePop .55s cubic-bezier(.3,1.6,.5,1); display:inline-block; }
  @keyframes badgePop{
    0%{ transform:scale(.3); opacity:0; }
    55%{ transform:scale(1.3); opacity:1; }
    100%{ transform:scale(1); }
  }

  /* ── 세그먼트 아이콘 숨쉬기 ── */
  .seg[aria-selected="true"] img{ animation:breathe 3.6s ease-in-out 1.2s infinite; }
  @keyframes breathe{
    0%,100%{ transform:scale(1.12) rotate(-6deg); }
    50%{ transform:scale(1.18) rotate(-2deg); }
  }

  /* ── 연기 (시간 초과) ── */
  .fx-smoke{ position:fixed; inset:0; z-index:285; pointer-events:none; overflow:hidden; }
  .fx-smoke i{
    position:absolute; bottom:-40px; border-radius:50%;
    background:radial-gradient(circle, rgba(220,220,225,.55), rgba(220,220,225,0) 70%);
    animation:smokeUp 3.4s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ transform:translateY(0) scale(.5); opacity:0; }
    15%{ opacity:.75; }
    100%{ transform:translateY(-78vh) scale(2.3); opacity:0; }
  }

  /* ── 첫 로딩 스플래시 ── */
  .boot{
    position:fixed; inset:0; z-index:400;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:linear-gradient(170deg,#FFF6F8,#FDF1EC);
    animation:bootOut .5s ease 1.25s forwards;
  }
  .boot img{
    width:104px; height:104px; border-radius:26px; object-fit:cover;
    box-shadow:0 12px 34px rgba(160,110,120,.3);
    animation:bootPop .8s cubic-bezier(.3,1.5,.5,1) both;
  }
  .boot .t{
    font-family:'Gaegu',cursive; font-size:19px; font-weight:700; color:#7B5E58;
    animation:bootFade .7s ease .22s both;
  }
  .boot .greet{
    font-size:13.5px; color:#8A716B; text-align:center; padding:0 28px; line-height:1.6;
    animation:bootFade .7s ease .4s both;
  }
  html[data-theme="dark"] .boot .greet{ color:#A8958F; }
  .boot .bar{ width:92px; height:3px; border-radius:2px; background:rgba(0,0,0,.08); overflow:hidden; }
  .boot .bar i{ display:block; height:100%; width:40%; border-radius:2px; background:#F0A9BC; animation:bootBar 1.25s ease-in-out infinite; }
  @keyframes bootPop{
    0%{ transform:scale(.55) rotate(-10deg); opacity:0; }
    60%{ transform:scale(1.08) rotate(3deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  @keyframes bootFade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @keyframes bootBar{ 0%{transform:translateX(-120%);} 100%{transform:translateX(320%);} }
  @keyframes bootOut{ to{ opacity:0; visibility:hidden; } }

  /* ── 스켈레톤 로딩 ── */
  .skel{ padding:4px 0; }
  .skel .line{
    height:13px; border-radius:7px; margin:9px 0;
    background:linear-gradient(90deg, rgba(0,0,0,.055) 25%, rgba(0,0,0,.1) 37%, rgba(0,0,0,.055) 63%);
    background-size:400% 100%;
    animation:shimmer 1.35s ease-in-out infinite;
  }
  .skel .line.w60{ width:60%; } .skel .line.w40{ width:40%; } .skel .line.w85{ width:85%; }
  .skel .line.tall{ height:34px; border-radius:11px; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  /* ── 상태 배지 전환 ── */
  .status{ transition:background .55s ease, color .55s ease; }
  .status.just-changed{ animation:statusWash .85s ease both; }
  @keyframes statusWash{
    0%{ transform:scale(.86); filter:saturate(2.2) brightness(1.12); }
    40%{ transform:scale(1.12); }
    100%{ transform:scale(1); filter:none; }
  }

  /* ── 당겨서 새로고침 ── */
  .ptr{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    z-index:120; display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.95); box-shadow:0 3px 12px rgba(0,0,0,.16);
    opacity:0; pointer-events:none;
  }
  .ptr svg{ width:19px; height:19px; stroke:#C98BA0; stroke-width:2.4; fill:none; stroke-linecap:round; }
  .ptr.spin svg{ animation:ptrSpin .75s linear infinite; }
  @keyframes ptrSpin{ to{ transform:rotate(360deg); } }

  /* ── 고구마 뻐끔 (승인 시) ── */
  .puff{ position:fixed; inset:0; z-index:286; pointer-events:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  .puff img{
    width:116px; height:116px; border-radius:26px; object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    animation:puffPop 1.9s cubic-bezier(.3,1.3,.5,1) both;
  }
  @keyframes puffPop{
    0%{ transform:scale(.5) translateY(26px); opacity:0; }
    18%{ transform:scale(1.06) translateY(0); opacity:1; }
    30%{ transform:scale(1); }
    78%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1.1) translateY(-14px); opacity:0; }
  }
  .puff i{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(236,236,240,.8), rgba(236,236,240,0) 70%);
    animation:puffRise 1.9s ease-out forwards;
  }
  @keyframes puffRise{
    0%{ transform:translate(0,0) scale(.3); opacity:0; }
    25%{ opacity:.85; }
    100%{ transform:translate(var(--dx,20px), -190px) scale(2.4); opacity:0; }
  }

  /* ── 시무룩한 토끼 (연차 소진) ── */
  .sad-rabbit{ display:inline-block; animation:sadDroop 2.4s ease-in-out infinite; filter:grayscale(.45); }
  @keyframes sadDroop{
    0%,100%{ transform:rotate(-4deg) translateY(0); }
    50%{ transform:rotate(-7deg) translateY(3px); }
  }

  /* ── 이스터에그 ── */
  .egg-spin{ animation:eggSpin .9s cubic-bezier(.3,1.2,.4,1); }
  @keyframes eggSpin{
    0%{ transform:scale(1.12) rotate(-6deg); }
    40%{ transform:scale(1.5) rotate(190deg); }
    100%{ transform:scale(1.12) rotate(354deg); }
  }


  /* ── 다크모드 ── */
  html[data-theme="dark"] body{ background:#15161A; }
  html[data-theme="dark"] .top-banner{ background:linear-gradient(180deg,#242027,#1F1B21) !important; border-bottom-color:rgba(255,255,255,.07); }
  html[data-theme="dark"] .top-banner[data-mode="smoke"]{ background:linear-gradient(180deg,#242220,#1F1D1A) !important; }
  html[data-theme="dark"] .switcher{ background:rgba(255,255,255,.07); box-shadow:0 2px 14px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08); }
  html[data-theme="dark"] .seg{ color:#9A8E92; }
  html[data-theme="dark"] .seg[aria-selected="true"]{ color:#2A1F22; }
  html[data-theme="dark"] .boot{ background:linear-gradient(170deg,#1E1A20,#191519); }
  html[data-theme="dark"] .boot .t{ color:#D6C3C0; }
  html[data-theme="dark"] .boot .bar{ background:rgba(255,255,255,.1); }
  html[data-theme="dark"] .ptr{ background:rgba(45,40,46,.96); }
  html[data-theme="dark"] .skel .line{ background:linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.12) 37%, rgba(255,255,255,.06) 63%); background-size:400% 100%; }
  html[data-theme="dark"] #app-leave{
      --pink:#2E252B; --pink-deep:#3C3038; --cream:#15161A; --lavender:#9B86B8;
      --brown:#C0A99C; --ink:#EDE4E0; --muted:#938781;
      --stamp-red:#E08798; --stamp-black:#A99C95; --ok:#8FC894; --warn:#E0A860;
    }
  html[data-theme="dark"] #app-smoke{
      --sky:#20262B; --sky-deep:#2D363D; --cream:#15161A; --slate:#A9BAC3;
      --ink:#E6EDF0; --muted:#8A9AA3; --stamp-red:#E08798; --stamp-black:#A99C95; --ok:#7FC0B8;
    }
  html[data-theme="dark"] #app-leave .card, html[data-theme="dark"] #app-smoke .card{ background:#1E2025 !important; }
  html[data-theme="dark"] #app-leave .field input, html[data-theme="dark"] #app-leave .field textarea, html[data-theme="dark"] #app-leave .field select, html[data-theme="dark"] #app-smoke .field input, html[data-theme="dark"] #app-smoke .field textarea, html[data-theme="dark"] #app-smoke .field select{
      background:#23262C !important; color:var(--ink);
    }
  html[data-theme="dark"] #app-leave .status.pending{background:#4A3C1E; color:#E8C878;}
  html[data-theme="dark"] #app-leave .status.approved{background:#2B4430; color:#95D59C;}
  html[data-theme="dark"] #app-leave .status.rejected{background:#38332F; color:#BFB3AC;}
  html[data-theme="dark"] #app-smoke .status.pending{background:#4A3C1E; color:#E8C878;}
  html[data-theme="dark"] #app-smoke .status.approved{background:#2B4430; color:#95D59C;}
  html[data-theme="dark"] #app-smoke .status.rejected{background:#38332F; color:#BFB3AC;}
  html[data-theme="dark"] #app-leave .rules-box{ background:#2A2228 !important; }
  html[data-theme="dark"] .fx-toast{ background:rgba(48,44,52,.96); }

  .theme-btn{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(255,255,255,.72); box-shadow:0 2px 10px rgba(120,80,70,.16);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px); -webkit-tap-highlight-color:transparent;
    transition:transform .3s cubic-bezier(.34,1.4,.64,1), background .4s ease;
  }
  .theme-btn:active{ transform:translateY(-50%) scale(.9); }
  .theme-btn svg{ width:19px; height:19px; stroke:#8A6F6A; stroke-width:1.9; fill:none; stroke-linecap:round; }
  .theme-btn .moon{ display:none; }
  html[data-theme="dark"] .theme-btn{ background:rgba(255,255,255,.1); }
  html[data-theme="dark"] .theme-btn svg{ stroke:#E8D4B8; }
  html[data-theme="dark"] .theme-btn .moon{ display:block; }
  html[data-theme="dark"] .theme-btn .sun{ display:none; }
  .theme-btn.flip{ animation:themeFlip .55s cubic-bezier(.3,1.4,.5,1); }
  @keyframes themeFlip{
    0%{ transform:translateY(-50%) rotate(0) scale(1); }
    50%{ transform:translateY(-50%) rotate(180deg) scale(1.18); }
    100%{ transform:translateY(-50%) rotate(360deg) scale(1); }
  }
  .switcher{ max-width:min(380px, calc(100% - 56px)); }

  /* iOS 입력 시 자동 확대 방지 — 16px 미만이면 확대됨 */
  #app-leave input, #app-leave textarea, #app-leave select,
  #app-smoke input, #app-smoke textarea, #app-smoke select{
    font-size:16px !important;
  }

<script>
/* ── 공용 연출 도구 ── */
window.FX = (function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function toast(msg, kind){
    var box = document.getElementById('fxToast');
    if(!box){
      box = document.createElement('div');
      box.id = 'fxToast';
      box.className = 'fx-toast';
      box.innerHTML = '<svg viewBox="0 0 24 24"><circle class="ring" cx="12" cy="12" r="10"/>'+
        '<path class="tick" d="M7.2 12.4l3.2 3.2 6.4-6.8"/></svg><span></span>';
      document.body.appendChild(box);
    }
    box.querySelector('span').textContent = msg;
    box.className = 'fx-toast' + (kind==='warn' ? ' warn' : '');
    void box.offsetWidth;
    box.classList.add('show');
    clearTimeout(box._t);
    box._t = setTimeout(function(){ box.classList.remove('show'); }, 2700);
  }

  function confetti(){
    if(reduce) return;
    var colors = ['#F5AFC0','#F6C46A','#9BD3A6','#A7BEE8','#E8A7D8','#FBD3DC'];
    var layer = document.createElement('div');
    layer.className = 'fx-confetti';
    for(var i=0;i<60;i++){
      var p = document.createElement('i');
      p.style.left = Math.random()*100+'vw';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.9 + Math.random()*1.5)+'s';
      p.style.animationDelay = (Math.random()*0.5)+'s';
      p.style.transform = 'rotate('+(Math.random()*360)+'deg)';
      if(Math.random() > .6){ p.style.borderRadius = '50%'; p.style.height = '9px'; }
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 4200);
  }

  function smoke(){
    if(reduce) return;
    var layer = document.createElement('div');
    layer.className = 'fx-smoke';
    for(var i=0;i<14;i++){
      var p = document.createElement('i');
      var size = 50 + Math.random()*90;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = (12 + Math.random()*76)+'vw';
      p.style.animationDelay = (Math.random()*1.4)+'s';
      p.style.animationDuration = (2.8 + Math.random()*1.6)+'s';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 5200);
  }

  /* 숫자가 굴러가며 바뀌도록 */
  function rollNumber(elx, from, to, unit){
    if(!elx) return;
    unit = unit || '';
    if(reduce || from === to){ elx.textContent = to + unit; return; }
    var start = performance.now(), dur = 620;
    elx.classList.add('bump');
    setTimeout(function(){ elx.classList.remove('bump'); }, 520);
    function step(now){
      var t = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      var val = from + (to - from) * eased;
      elx.textContent = (Math.round(val*10)/10) + unit;
      if(t < 1) requestAnimationFrame(step);
      else elx.textContent = to + unit;
    }
    requestAnimationFrame(step);
  }

  function inkSpread(stampEl){
    if(reduce || !stampEl) return;
    var ink = document.createElement('div');
    ink.className = 'stamp-ink';
    stampEl.appendChild(ink);
    setTimeout(function(){ ink.remove(); }, 1000);
  }

  function pop(elx){
    if(reduce || !elx) return;
    elx.classList.remove('count-pop');
    void elx.offsetWidth;
    elx.classList.add('count-pop');
  }

    const elx = document.getElementById(id);
    if(elx) d[id] = (elx.type === 'checkbox') ? elx.checked : elx.value;
  });
  return d;
}
function restoreDraft(ids, d){
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx && d[id] !== undefined){
      if(elx.type === 'checkbox') elx.checked = d[id];
      else elx.value = d[id];
    }
  });
}
let prevBalance = null;
function animateBalance(){
  const node = document.querySelector('#app-leave [data-balance]');
  if(!node) return;
  const now = state ? state.balance : null;
  if(now == null) return;
  if(prevBalance != null && prevBalance !== now){
    FX.rollNumber(node, prevBalance, now);
  }
  prevBalance = now;
}

function refreshCurrentView(){
  if(view === 'applicant'){
    const draft = captureDraft(APPLICANT_FIELD_IDS);
    renderApplicant();
    restoreDraft(APPLICANT_FIELD_IDS, draft);
    const dateInput = document.getElementById('L-theDate');
    const submitBtn = document.getElementById('L-submitBtn');
    const ack = document.getElementById('L-ackCheck');
    if(submitBtn && ack) submitBtn.disabled = !ack.checked;
    if(dateInput) dateInput.dispatchEvent(new Event('change'));
  } else {
    const draft = captureDraft(ADMIN_FIELD_IDS);
    renderAdmin();
    restoreDraft(ADMIN_FIELD_IDS, draft);
  }
  animateBalance();
}

if(stateRef){
  stateRef.on('value', (snapshot)=>{
    loadError = null;
    const val = snapshot.val();
    if(val && typeof val === 'object'){
      state = Object.assign(defaultState(), val);
      state.requests = Array.isArray(val.requests) ? val.requests : [];
      state.history = Array.isArray(val.history) ? val.history : [];
      applyYearRollover();
    } else {
      state = defaultState();
      saveState();
    }
    refreshCurrentView();
  }, (err)=>{
    console.error(err);
    loadError = '데이터베이스 접근이 거부됐어요 (권한 오류). Firebase Realtime Database 규칙이 게시(Publish)되어 있는지 확인해주세요. 원본 오류: ' + (err.message || String(err));
    refreshCurrentView();
  });
}

setTimeout(()=>{
  if(!state){
    loadError = loadError || 'Firebase 연결이 6초 넘게 응답이 없어요. firebaseConfig 값, 네트워크 연결, Realtime Database 규칙 게시 여부를 확인해주세요.';
    refreshCurrentView();
  }
}, 6000);

function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}
function fmtReq(item){
  return `${fmtDate(item.date)} ${item.startTime}~${item.endTime}`;
}
function describeTrip(item){
  return `📍 ${escapeHTML(item.place)} · 👥 ${escapeHTML(item.companion)}`;
}
const WORKDAY_HOURS = 5; // 유흥연차 1일 = 5시간

function hoursToDays(hours){
  let d = Math.round((hours / WORKDAY_HOURS) * 2) / 2; // 0.5일 단위로 반올림
  if(d > 1) d = 1;
  return d;
}
function timeRangeHours(startTime, endTime){
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  const startMin = sh*60 + sm;
  const endMin = eh*60 + em;
  if(endMin <= startMin) return 0;
  return (endMin - startMin) / 60;
}
function isWeekend(date){
  const d = new Date(date+"T00:00:00").getDay();
  return d === 0 || d === 6;
}
function touchesBlackout(date){
  const m = new Date(date+"T00:00:00").getMonth();
  return BLACKOUT_MONTHS.includes(m);
}
function uid(){ return 'r'+Date.now()+Math.random().toString(36).slice(2,7); }
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderApplicant(){
  const el = document.getElementById('L-view-applicant');
  if(!state){
    el.innerHTML = loadError
      ? `<div class="empty">불러오기 실패 😢<br><span style="font-size:11px">${escapeHTML(loadError)}</span></div>`

  }

  el.innerHTML = `
    <div class="card balance-hero">
      <div class="balance-num"><span class="num-roll" data-balance>${state.balance}</span><span style="font-size:18px">일</span></div>

    </div>

    <div class="card">
      <h2>유흥연차 신청하기</h2>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="L-theDate">
      </div>
      <div class="field">
        <label>시간</label>
        <div class="row2">
          <div><input type="time" id="L-startTime" value="09:00"></div>
          <div><input type="time" id="L-endTime" value="14:00"></div>
        </div>
      </div>
      <div class="field">
        <span class="days-badge" id="L-daysBadge">0일</span>
        <div class="warn-text" id="L-warnText"></div>
      </div>
      <div class="field">
        <label>어디를 갈 건가요?</label>
        <input type="text" id="L-place" placeholder="예) 강남역 포차거리">
      </div>
      <div class="field">
        <label>누구와 갈 건가요?</label>
        <input type="text" id="L-companion" placeholder="예) 대학 동기들">
      </div>
      <div class="field">
        <label>준수사항</label>
        <div class="rules-box">
          ${RULES.map(r=>`<div class="rule-line">${escapeHTML(r)}</div>`).join('')}
        </div>
        <label class="ack-label">
          <input type="checkbox" id="L-ackCheck"> 위 준수사항을 모두 확인했습니다
        </label>
      </div>
      <button class="action btn-primary" id="L-submitBtn" disabled>신청서 제출</button>
      ${(function(){
        const last = state.requests.filter(r=>r.status!=='rejected')
          .sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))[0];
        if(!last) return '';
        return `<button class="repeat-btn" id="L-repeatBtn">↻ 지난번처럼 (${escapeHTML(last.place||'')})</button>`;
      })()}
    </div>

    <div class="card">
      <h2>내 신청 내역</h2>
      <div id="L-myList"></div>
      <div class="actions" id="L-myListActions" style="display:none; margin-top:10px;">
        <button class="action btn-ghost" id="L-cancelSelectedBtn">선택 취소</button>
        <button class="action btn-reject" id="L-cancelAllBtn">모두 취소하기</button>
      </div>
    </div>
  `;

  const dateInput = document.getElementById('L-theDate');
  const startT = document.getElementById('L-startTime');
  const endT = document.getElementById('L-endTime');
  const badge = document.getElementById('L-daysBadge');
  const warnText = document.getElementById('L-warnText');
  const submitBtn = document.getElementById('L-submitBtn');
  const ackCheck = document.getElementById('L-ackCheck');

  function refreshSubmitState(){
    submitBtn.disabled = !ackCheck.checked;
  }
  ackCheck.addEventListener('change', refreshSubmitState);

  function validate(){
    const d = dateInput.value;
    const hours = timeRangeHours(startT.value, endT.value);
    if(hours <= 0){
      badge.textContent = '0일';
      warnText.textContent = '종료 시간이 시작 시간보다 늦어야 해요.';
      return;
    }
    if(hours > MAX_HOURS_PER_DAY){
      badge.textContent = `${hours}시간`;
      warnText.textContent = `1일 최대 ${MAX_HOURS_PER_DAY}시간까지만 신청할 수 있어요.`;
      return;
    }
    const days = hoursToDays(hours);
    badge.textContent = `${days}일 (${hours}시간)`;
    if(!d){ warnText.textContent=''; return; }
    if(touchesBlackout(d)){
      warnText.textContent = '6·7·8월에는 유흥연차를 사용할 수 없어요.';
    } else if(days > state.balance){
      warnText.textContent = `보유 유흥연차(${state.balance}일)보다 많아요.`;
    } else {
      warnText.textContent = '';
    }
  }
  const lRepeat = document.getElementById('L-repeatBtn');
  if(lRepeat){
    lRepeat.addEventListener('click', ()=>{
      const last = state.requests.filter(r=>r.status!=='rejected')

      if(last.endTime) endT.value = last.endTime;
      document.getElementById('L-place').value = last.place || '';
      document.getElementById('L-companion').value = last.companion || '';
      validate();
      FX.haptic(10);
      FX.toast('지난번 내용을 불러왔어요');
    });
  }

  dateInput.addEventListener('change', validate);
  startT.addEventListener('change', validate);
  endT.addEventListener('change', validate);
  validate();
  refreshSubmitState();

  submitBtn.addEventListener('click', async ()=>{
    if(!ackCheck.checked){ alert('준수사항을 확인해주세요.'); return; }
    const d = dateInput.value;
    if(!d){ alert('날짜를 입력해주세요.'); return; }
    const hours = timeRangeHours(startT.value, endT.value);
    if(hours <= 0){ alert('종료 시간이 시작 시간보다 늦어야 해요.'); return; }
    if(hours > MAX_HOURS_PER_DAY){ alert(`1일 최대 ${MAX_HOURS_PER_DAY}시간까지만 신청할 수 있어요.`); return; }
    if(touchesBlackout(d)){ alert('6·7·8월에는 유흥연차를 사용할 수 없어요.'); return; }
    const days = hoursToDays(hours);
    if(days > state.balance){ alert(`보유 유흥연차(${state.balance}일)보다 많이 신청할 수 없어요.`); return; }
    const place = document.getElementById('L-place').value.trim();
    const companion = document.getElementById('L-companion').value.trim();
    if(!place){ alert('어디를 갈 건지 입력해주세요.'); return; }
    if(!companion){ alert('누구와 갈 건지 입력해주세요.'); return; }

    submitBtn.disabled = true; submitBtn.textContent = '제출 중...';
    state.requests.push({
      id: uid(), date: d, startTime: startT.value, endTime: endT.value, days, place, companion,
      status: 'pending', comment: '', submittedAt: new Date().toISOString(),
      decidedAt: null
    });
    await saveState();
    notifyTelegram(CHAT_ID_구마구마, `🐰 이토끼님이 유흥연차 신청했어요: ${d} ${startT.value}~${endT.value} (${days}일) — ${place} / ${companion}. 결재 부탁해요!`);
    submitBtn.textContent = '신청서 제출';
    document.getElementById('L-place').value='';
    document.getElementById('L-companion').value='';
    ackCheck.checked = false;
    refreshSubmitState();
    warnText.textContent='';
    FX.happy(FX.ICONS.leave);
    FX.toast('제출되었어요! 구마구마님의 결재를 기다려주세요');
    renderApplicant();
  });

  const myList = document.getElementById('L-myList');
  const myListActions = document.getElementById('L-myListActions');
  const statusLabel = {pending:'대기', approved:'승인', rejected:'반려'};
  if(mine.length === 0){
    myList.innerHTML = `<div class="empty">아직 신청 내역이 없어요.</div>`;
    myListActions.style.display = 'none';
  } else {
    myListActions.style.display = 'flex';
    myList.innerHTML = mine.map(item => `
      <div style="display:flex; gap:8px; padding:8px 0; border-bottom:1px dashed var(--pink);">
        <input type="checkbox" class="mine-check" data-id="${item.id}" style="margin-top:4px; width:16px; height:16px; flex-shrink:0;">
        <div style="flex:1;">
          <div class="req-meta">${fmtReq(item)} · ${item.days}일

          </div>
          <div class="req-reason">${describeTrip(item)}</div>

        </div>
      </div>
    `).join('');
  }

  function cancelMyRequests(ids){
    ids.forEach(id=>{
      const idx = state.requests.findIndex(r=>r.id===id);
      if(idx === -1) return;
      const item = state.requests[idx];
      if(item.status === 'approved'){
        state.balance = Math.round((state.balance + item.days) * 10) / 10;
        state.history.unshift({ note:`이토끼가 신청 취소: ${fmtReq(item)} (${item.days}일 반환)`, at:new Date().toISOString() });
      } else {
        state.history.unshift({ note:`이토끼가 신청 취소: ${fmtReq(item)}`, at:new Date().toISOString() });
      }
      state.requests.splice(idx,1);
    });
  }

  myList.querySelectorAll('button[data-my-cancel-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.confirming !== '1'){
        btn.dataset.confirming = '1';
        btn.textContent = '진짜 취소?';
        setTimeout(()=>{
          if(btn.dataset.confirming === '1'){ btn.dataset.confirming=''; btn.textContent='취소'; }

        return;
      }
      cancelMyRequests([btn.dataset.myCancelId]);
      await saveState();
      renderApplicant();
    });
  });

  const cancelSelectedBtn = document.getElementById('L-cancelSelectedBtn');
  const cancelAllBtn = document.getElementById('L-cancelAllBtn');
  if(cancelSelectedBtn){

        setTimeout(()=>{
          if(cancelSelectedBtn.dataset.confirming === '1'){ cancelSelectedBtn.dataset.confirming=''; cancelSelectedBtn.textContent='선택 취소'; }
        }, 4000);
        return;
      }
      cancelMyRequests(ids);
      await saveState();
      renderApplicant();
    });
  }
  if(cancelAllBtn){
    cancelAllBtn.addEventListener('click', async ()=>{
      const ids = mine.map(item=>item.id);

        }, 4000);
        return;
      }
      cancelMyRequests(ids);
      await saveState();
      renderApplicant();
    });
  }
}

function compressImage(file, maxWidth=600, quality=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        document.getElementById('S-memo').value = last.memo || '';
        FX.haptic(10);
        FX.toast('지난번 내용을 불러왔어요');
      });
    }

    el.querySelectorAll('button[data-quick-memo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.getElementById('S-memo').value = btn.dataset.quickMemo;
      });
    });
    document.getElementById('S-submitBtn').addEventListener('click', async ()=>{
      const minutes = parseInt(document.getElementById('S-minutes').value, 10);
      const memo = document.getElementById('S-memo').value.trim();
      const btn = document.getElementById('S-submitBtn');
      btn.disabled = true; btn.textContent = '제출 중...';
      const item = {
        id: uid(), minutes, memo, status:'pending',
        submittedAt: new Date().toISOString(), decidedAt: null, approvedAt: null
      };
      state.requests.push(item);
      await saveState();
      notifyTelegram(CHAT_ID_이토끼, `💨 구마구마님이 흡연 ${minutes}분 신청했어요${memo ? ' — '+memo : ''}. 결재 부탁해요!`);
      FX.toast('신청했어요! 이토끼님의 결재를 기다려주세요');
      (function(){
        const today = new Date().toISOString().slice(0,10);
        const n = state.requests.filter(r=>
          (r.date||(r.submittedAt||'').slice(0,10))===today && r.status!=='rejected').length;
        if(n > 5) setTimeout(()=>FX.toast('오늘 벌써 '+n+'번째예요... 고구마가 걱정해요', 'warn'), 2900);
      })();
      if(window.updateDailyStrip) window.updateDailyStrip();
      renderApplicant();
    });
  }

  const historyMine = document.getElementById('S-historyMine');
  if(historyMine){
    if(mine.length === 0){
      historyMine.innerHTML = `<div class="empty">아직 내역이 없어요.</div>`;
    } else {
      historyMine.innerHTML = mine.map(item => `
        <div style="padding:8px 0; border-bottom:1px dashed var(--sky);">
          <div class="req-meta">${fmtDateTime(item.submittedAt)} · ${item.minutes}분${item.actualMinutes ? ` (실제 ${item.actualMinutes}분)` : ''}
            <span class="status ${item.status}">${statusLabel[item.status]}</span>
          </div>
          ${item.memo ? `<div class="req-reason">${escapeHTML(item.memo)}</div>` : ''}
          ${item.status === 'approved' ? (item.photo ? `
            <div style="margin-top:6px;">
              <button class="action btn-ghost" data-toggle-photo="${item.id}" style="padding:6px 10px; font-size:11px;">📷 사진 보기/숨기기</button>
              <button class="action btn-ghost" data-retake-photo="${item.id}" style="padding:6px 10px; font-size:11px; margin-left:6px;">다시 찍기</button>
              ${item.photoAt ? `<div class="req-meta" style="margin-top:4px;">📅 ${fmtTime(item.photoAt)} 업로드</div>` : ''}
              <img data-photo-img="${item.id}" src="${item.photo}" style="display:none; width:100%; border-radius:10px; margin-top:8px;">
              <input type="file" accept="image/*" capture="environment" data-photo-input="${item.id}" style="display:none;">
            </div>
          ` : `
            <div style="margin-top:6px;">
              <label style="font-size:11px; color:var(--muted); display:block; margin-bottom:4px;">인증사진 올리기</label>
              <input type="file" accept="image/*" capture="environment" data-photo-input="${item.id}">
            </div>
          `) : ''}
        </div>
      `).join('');

      historyMine.querySelectorAll('input[data-photo-input]').forEach(inp=>{
        inp.addEventListener('change', async (ev)=>{
          const file = ev.target.files[0];
          if(!file) return;
          const targetItem = state.requests.find(r=>r.id===inp.dataset.photoInput);
          if(!targetItem) return;
          try{
            const dataUrl = await compressImage(file);
            targetItem.photo = dataUrl;
            targetItem.photoAt = new Date().toISOString();
            await saveState();
            renderApplicant();
          }catch(e){
            console.error(e);
            alert('사진 처리에 실패했어요. 다시 시도해주세요.');
          }
        });
      });
      historyMine.querySelectorAll('button[data-toggle-photo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const img = historyMine.querySelector(`img[data-photo-img="${btn.dataset.togglePhoto}"]`);
          if(img) img.style.display = img.style.display === 'none' ? 'block' : 'none';
        });
      });
      historyMine.querySelectorAll('button[data-retake-photo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const inp = historyMine.querySelector(`input[data-photo-input="${btn.dataset.retakePhoto}"]`);
          if(inp) inp.click();
        });
      });
    }
  }
}

function startTimer(current){
  if(tickInterval) clearInterval(tickInterval);
  if(current.status !== 'approved' || !current.actualStartAt || current.completed) return;
  function tick(){
    const elx = document.getElementById('S-timerNum');
    const labelEl = document.getElementById('S-timerLabel');
    if(!elx) { clearInterval(tickInterval); return; }
    const elapsedSec = Math.floor((Date.now() - new Date(current.actualStartAt).getTime()) / 1000);
    const totalSec = current.minutes * 60;
    const remain = totalSec - elapsedSec;
    if(remain <= 0){
      clearInterval(tickInterval);
      current.actualEndAt = new Date().toISOString();
      current.actualMinutes = current.minutes;
      current.completed = true;
      saveState();
      FX.smoke();
      FX.toast('시간 다 됐어요! 들어가실 시간이에요');
      renderApplicant();
      return;
    }
    const mm = String(Math.floor(remain/60)).padStart(2,'0');
    const ss = String(remain%60).padStart(2,'0');
    elx.textContent = `${mm}:${ss}`;
    labelEl.textContent = '남은 시간';
    // 초마다 똑딱, 1분 미만이면 맥박
    elx.classList.remove('tick');
    void elx.offsetWidth;
    elx.classList.add('tick');
    if(remain <= 60) elx.classList.add('urgent');
    else elx.classList.remove('urgent');
  }
  tick();
  tickInterval = setInterval(tick, 1000);
}

/* ---------------- 관리자 뷰 ---------------- */
function renderAdmin(){
  const el = document.getElementById('S-view-admin');
  if(!state){
    el.innerHTML = loadError
      ? `<div class="empty">불러오기 실패 😢<br><span style="font-size:11px">${escapeHTML(loadError)}</span></div>`
      : FX.skeleton(3);
    return;
  }

  if(!state.adminPasswordHash){
    el.innerHTML = `
      <div class="card">
        <h2>🔐 관리자 비밀번호 설정</h2>
        <p style="font-size:13px; color:var(--slate);">처음 사용이시네요! 결재함에 들어갈 비밀번호를 설정해주세요.</p>
        <div class="field"><label>비밀번호</label><input type="password" id="S-pw1"></div>
        <div class="field"><label>비밀번호 확인</label><input type="password" id="S-pw2"></div>
        <button class="action btn-primary" id="S-setPwBtn">설정하기</button>
      </div>
    `;
    document.getElementById('S-setPwBtn').addEventListener('click', async ()=>{
      const p1 = document.getElementById('S-pw1').value;
      const p2 = document.getElementById('S-pw2').value;
      if(!p1){ alert('비밀번호를 입력해주세요.'); return; }
      if(p1 !== p2){ alert('비밀번호가 일치하지 않아요.'); return; }
      state.adminPasswordHash = simpleHash(p1);
      await saveState();
      FX.toast('설정 완료!');
      renderAdmin();
    });
    return;
  }

  if(!adminUnlocked){
    el.innerHTML = `
      <div class="card">
        <h2>🔐 관리자 로그인</h2>
        <div class="field"><label>비밀번호</label><input type="password" id="S-pwInput"></div>
        <button class="action btn-primary" id="S-unlockBtn">잠금 해제</button>
        <div class="lock-msg">결재권자 이토끼님만 들어올 수 있어요.</div>
      </div>
    `;
    const tryUnlock = async ()=>{
      const p = document.getElementById('S-pwInput').value;
      if(simpleHash(p) === state.adminPasswordHash){ adminUnlocked = true; renderAdmin(); }
      else { alert('비밀번호가 맞지 않아요.'); }
    };
    document.getElementById('S-unlockBtn').addEventListener('click', tryUnlock);
    document.getElementById('S-pwInput').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') tryUnlock(); });
    return;
  }

  function getWeekStart(){
    const now = new Date();
    const day = now.getDay(); // 0=Sun ... 6=Sat
    const diffToMonday = day === 0 ? 6 : day - 1;
    const monday = new Date(now);
    monday.setDate(now.getDate() - diffToMonday);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function weeklyStats(){
    const weekStart = getWeekStart();
    const relevant = state.requests.filter(r=>{
      if(r.status !== 'approved') return false;
      const d = new Date(r.submittedAt);
      if(d < weekStart) return false;
      return true;
    });
    const totalCount = relevant.length;
    const totalMinutes = relevant.reduce((sum,r)=> sum + (r.actualMinutes || r.minutes), 0);
    const avgMinutes = totalCount > 0 ? Math.round((totalMinutes/totalCount)*10)/10 : 0;
    return { totalCount, totalMinutes, avgMinutes };
  }
  const stats = weeklyStats();

  const pending = state.requests.filter(r=>r.status==='pending').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));
  const decided = state.requests.filter(r=>r.status!=='pending').sort((a,b)=>(b.decidedAt||'').localeCompare(a.decidedAt||'')).slice(0,15);
  const statusLabel = {approved:'승인', rejected:'반려'};

  el.innerHTML = `
    <div class="card">
      <h2>이번 주 통계</h2>
      
      <div class="req-meta">이번 주 ${stats.totalCount}회 · 총 ${stats.totalMinutes}분 사용 · 평균 ${stats.avgMinutes}분</div>
    </div>
    <div class="card">
      <h2>결재 대기 <span class="count-pop" data-pending-count>${pending.length}</span>건</h2>
      <div id="S-pendingList">${pending.length===0 ? '<div class="empty">대기 중인 신청이 없어요.</div>' : ''}</div>
    </div>
    <div class="card">
      <h2>처리 내역</h2>
      <div id="S-decidedList">${decided.length===0 ? '<div class="empty">아직 처리한 내역이 없어요.</div>' : ''}</div>
    </div>
    <button class="link-btn" id="S-lockBtn">결재함 잠그기</button>
    <button class="link-btn" id="S-changePwBtn" style="margin-left:12px;">비밀번호 변경</button>
    <button class="link-btn" id="S-resetBtn" style="margin-left:12px; color:var(--stamp-red);">신청내역 초기화</button>
  `;

  const pendingList = document.getElementById('S-pendingList');
  pendingList.innerHTML += pending.map(item => `
    <div class="card" data-id="${item.id}" style="margin:10px 0 0;">
      <div class="req-meta">${fmtDateTime(item.submittedAt)} 신청 · ${item.minutes}분</div>
      ${item.memo ? `<div class="req-reason">${escapeHTML(item.memo)}</div>` : ''}
      <div class="actions">
        <span class="stamp-wrap"><button class="action btn-approve" data-action="approve" data-id="${item.id}">승인</button></span>
        <button class="action btn-reject" data-action="reject" data-id="${item.id}">반려</button>
      </div>
    </div>
  `).join('');

  pendingList.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const item = state.requests.find(r=>r.id===id);
      if(!item) return;
      item.status = action === 'approve' ? 'approved' : 'rejected';
      item.decidedAt = new Date().toISOString();
      if(action === 'approve') item.approvedAt = item.decidedAt;
      const card = pendingList.querySelector(`.card[data-id="${id}"]`);
      card.querySelectorAll('button').forEach(b=>b.disabled=true);
      const stampSpan = card.querySelector('.stamp-wrap');
      if(stampSpan){
        const stamp = document.createElement('div');
        stamp.className = 'stamp' + (action==='reject' ? ' reject' : '');
        stamp.textContent = action==='approve' ? '승인' : '반려';
        stampSpan.appendChild(stamp);
        FX.inkSpread(stamp);
        FX.haptic(action==='approve' ? [14, 40, 20] : 26);
      }
      await saveState();
      if(action==='approve') FX.puff(FX.ICONS.smoke);
      notifyTelegram(CHAT_ID_구마구마, action==='approve'
        ? `✅ 이토끼님이 흡연 ${item.minutes}분 승인했어요. 다녀오세요!`
        : `❌ 이토끼님이 흡연 신청을 반려했어요.`);
      setTimeout(renderAdmin, 550);
    });
  });

  const decidedList = document.getElementById('S-decidedList');
  decidedList.innerHTML += decided.map(item => `
    <div data-decided-id="${item.id}" style="padding:8px 0; border-bottom:1px dashed var(--sky);">
      <div class="req-meta">${fmtDateTime(item.submittedAt)} · ${item.minutes}분${item.actualMinutes ? ` (실제 ${item.actualMinutes}분)` : ''}
        <span class="status ${item.status}">${statusLabel[item.status]}</span>
      </div>
      ${item.memo ? `<div class="req-reason">${escapeHTML(item.memo)}</div>` : ''}
      ${item.photo ? `
        <button class="action btn-ghost" data-toggle-photo="${item.id}" style="margin-top:6px; padding:6px 10px; font-size:11px;">📷 인증사진 보기/숨기기</button>
        ${item.photoAt ? `<div class="req-meta" style="margin-top:4px;">📅 ${fmtTime(item.photoAt)} 업로드</div>` : ''}
        <img data-photo-img="${item.id}" src="${item.photo}" style="display:none; width:100%; border-radius:10px; margin-top:8px;">
      ` : ''}
    </div>
  `).join('');

  decidedList.querySelectorAll('button[data-toggle-photo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const img = decidedList.querySelector(`img[data-photo-img="${btn.dataset.togglePhoto}"]`);
      if(img) img.style.display = img.style.display === 'none' ? 'block' : 'none';
    });
  });

  document.getElementById('S-lockBtn').addEventListener('click', ()=>{ adminUnlocked = false; renderAdmin(); });
  document.getElementById('S-changePwBtn').addEventListener('click', async ()=>{
    const cur = prompt('현재 비밀번호를 입력해주세요.');
    if(simpleHash(cur||'') !== state.adminPasswordHash){ alert('현재 비밀번호가 맞지 않아요.'); return; }
    const np = prompt('새 비밀번호를 입력해주세요.');
    if(!np) return;
    state.adminPasswordHash = simpleHash(np);
    await saveState();
    FX.toast('비밀번호가 변경됐어요.');
  });
  document.getElementById('S-resetBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('S-resetBtn');
    if(btn.dataset.confirming !== '1'){
      btn.dataset.confirming = '1';
      btn.textContent = '진짜 삭제할까요? (다시 누르면 삭제됨)';
      setTimeout(()=>{ if(btn.dataset.confirming==='1'){ btn.dataset.confirming=''; btn.textContent='신청내역 초기화'; } }, 4000);
      return;
    }
    btn.dataset.confirming = '';
    state.requests = [];
    await saveState();
    renderAdmin();
  });
}

  view = 'applicant';
  document.getElementById('S-btnApplicant').classList.add('active');

window.__smokeSummary = function(){
  if(!state || !state.requests) return '';
  const today = new Date().toISOString().slice(0,10);
  const list = state.requests.filter(r=>(r.date||(r.submittedAt||'').slice(0,10))===today);
  const done = list.filter(r=>r.status==='approved').length;
  const wait = list.filter(r=>r.status==='pending').length;
  if(!done && !wait) return '';
  let s = '오늘 흡연 ' + done + '회';
  if(wait) s += ' · 대기 ' + wait + '건';
  return s;
};

window.addEventListener('error', (ev)=>{
  const elx = document.getElementById(view === 'admin' ? 'S-view-admin' : 'S-view-applicant');
  if(elx && !state){
    elx.innerHTML = `<div class="empty">오류가 발생했어요 😢<br><span style="font-size:11px">${escapeHTML(ev.message || String(ev.error))}</span></div>`;
  }
});

renderApplicant();

})();
</script>
<script>
  const siteTabLeave = document.getElementById('siteTabLeave');
  const siteTabSmoke = document.getElementById('siteTabSmoke');
  const appLeave = document.getElementById('app-leave');
  const appSmoke = document.getElementById('app-smoke');

  const splash = document.getElementById('siteSplash');
  const splashGlyph = document.getElementById('splashGlyph');
  const splashLabel = document.getElementById('splashLabel');
  let current = 'leave';
  let busy = false;

  const SPLASH_ICONS = FX.ICONS;

  function playSplash(which, label){
    splashGlyph.src = SPLASH_ICONS[which];
    splashLabel.textContent = label;
    splash.classList.remove('show');
    void splash.offsetWidth; // 애니메이션 재시작
    splash.classList.add('show');
  }

  function swapPanel(showEl, hideEl){
    hideEl.style.display = 'none';
    showEl.style.display = 'block';
    showEl.classList.remove('enter');
    void showEl.offsetWidth;
    showEl.classList.add('enter');
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  const switcher = document.getElementById('switcher');
  const topBanner = document.getElementById('topBanner');
  // 세그먼트 아이콘도 스플래시와 같은 이미지 사용
  document.getElementById('segIconLeave').src = SPLASH_ICONS.leave;
  document.getElementById('segIconSmoke').src = SPLASH_ICONS.smoke;

  function setMode(mode){
    switcher.dataset.mode = mode;
    topBanner.dataset.mode = mode;
    siteTabLeave.setAttribute('aria-selected', mode==='leave' ? 'true' : 'false');
    siteTabSmoke.setAttribute('aria-selected', mode==='smoke' ? 'true' : 'false');
  }

  function showLeave(){
    if(busy || current === 'leave') return;
    busy = true; current = 'leave';
    setMode('leave');
    playSplash('leave', '유흥연차');
    setTimeout(function(){
      swapPanel(appLeave, appSmoke);
      document.title = '이토끼 유흥연차결재';
    }, 230);
    setTimeout(function(){ busy = false; }, 780);
  }

  function showSmoke(){
    if(busy || current === 'smoke') return;
    busy = true; current = 'smoke';
    setMode('smoke');
    playSplash('smoke', '흡연결재');
    setTimeout(function(){
      swapPanel(appSmoke, appLeave);
      document.title = '흡연시간 결재';
    }, 230);
    setTimeout(function(){ busy = false; }, 780);
  }

  siteTabLeave.addEventListener('click', function(){ FX.haptic(10); showLeave(); });
  siteTabSmoke.addEventListener('click', function(){ FX.haptic(10); showSmoke(); });

  /* ── 첫 로딩 스플래시 ── */
  (function(){
    var btn = document.getElementById('themeBtn');
    var KEY = 'dydy_theme';
    function apply(mode){
      document.documentElement.setAttribute('data-theme', mode);
      var meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', mode==='dark' ? '#1F1B21' : '#FFF6F8');
    }
    var saved = null;
    try{ saved = localStorage.getItem(KEY); }catch(e){}
    apply(saved || 'light');
    btn.addEventListener('click', function(){
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
      btn.classList.remove('flip');
      void btn.offsetWidth;
      btn.classList.add('flip');
      FX.haptic(10);
    });
  })();

  /* ── 새 버전 자동 감지 ── */
  (function(){
    var meta = document.querySelector('meta[name="app-version"]');
    var MY_VERSION = meta ? meta.getAttribute('content') : null;
    if(!MY_VERSION) return;

    function check(){
      if(document.hidden) return;
      fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' })
        .then(function(r){ return r.text(); })
        .then(function(html){
          var m = html.match(/<meta name="app-version" content="([^"]+)"/);
          if(m && m[1] !== MY_VERSION){
            FX.toast('새 버전이 있어요. 잠시 후 새로고침됩니다');
            setTimeout(function(){ location.reload(true); }, 1800);
          }
        })
        .catch(function(){});
    }

    // 앱을 다시 열거나 화면으로 돌아올 때, 그리고 10분마다 확인
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) check();
    });
    setTimeout(check, 3000);
    setInterval(check, 600000);
  })();

  /* ── 오늘 인사 + 요약 (하루 한 번) ── */
  window.updateDailyStrip = function(){
    var strip = document.getElementById('dailyStrip');
    var inner = document.getElementById('dailyInner');
    if(!strip || !inner) return;
    var html = '';
    var bits = [];
    if(window.__leaveSummary) bits.push(window.__leaveSummary());
    if(window.__smokeSummary) bits.push(window.__smokeSummary());
    bits = bits.filter(Boolean);
    if(bits.length) html += bits.join(' · ');

    if(html){ inner.innerHTML = html; strip.style.display = 'block'; }
    else strip.style.display = 'none';
  };
  setTimeout(window.updateDailyStrip, 2100);

  document.getElementById('bootIcon').src = FX.COMBO_ICON;
  (function(){
    var g = document.getElementById('bootGreet');
    if(g) g.textContent = FX.greeting('이토끼, 구마구마');
  })();
  setTimeout(function(){
    var b = document.getElementById('bootSplash');
    if(b) b.remove();
  }, 1850);

  /* ── 당겨서 새로고침 ── */
  (function(){
    var ptr = document.getElementById('ptrIndicator');
    var startY = 0, pulling = false, dist = 0;
    var THRESHOLD = 72;

    document.addEventListener('touchstart', function(e){
      if(window.scrollY > 0 || e.touches.length !== 1) return;
      startY = e.touches[0].clientY; pulling = true; dist = 0;
    }, {passive:true});

    document.addEventListener('touchmove', function(e){
      if(!pulling) return;
      dist = e.touches[0].clientY - startY;
      if(dist <= 0){ ptr.style.opacity = 0; return; }
      if(window.scrollY > 0){ pulling = false; ptr.style.opacity = 0; return; }
      var pct = Math.min(1, dist / THRESHOLD);
      ptr.style.opacity = pct;
      ptr.style.transform = 'translateX(-50%) translateY('+Math.min(dist*0.5, 58)+'px) rotate('+(dist*2.4)+'deg)';
    }, {passive:true});

    document.addEventListener('touchend', function(){
      if(!pulling){ return; }
      pulling = false;
      if(dist >= THRESHOLD){
        ptr.classList.add('spin');
        ptr.style.opacity = 1;
        ptr.style.transform = 'translateX(-50%) translateY(52px)';
        FX.haptic(14);
        setTimeout(function(){ location.reload(); }, 420);
      } else {
        ptr.style.opacity = 0;
        ptr.style.transform = 'translateX(-50%)';
      }
    }, {passive:true});
  })();

  /* ── 이스터에그: 아이콘 5번 연타 ── */
  (function(){
    var taps = 0, timer = null;
    function hit(imgEl){
      taps++;
      clearTimeout(timer);
      timer = setTimeout(function(){ taps = 0; }, 1400);
      if(taps >= 5){
        taps = 0;
        imgEl.classList.remove('egg-spin');
        void imgEl.offsetWidth;
        imgEl.classList.add('egg-spin');
        FX.confetti();
        FX.haptic([12, 50, 12]);
        FX.toast('🥔🐰 구마와 토끼는 오늘도 평화롭습니다');
      }
    }
    siteTabLeave.addEventListener('click', function(){ hit(document.getElementById('segIconLeave')); });
    siteTabSmoke.addEventListener('click', function(){ hit(document.getElementById('segIconSmoke')); });
  })();
</script>
</body>
