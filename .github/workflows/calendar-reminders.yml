name: Calendar Telegram reminders
on:
  schedule:
    # Repeated runs allow delayed jobs and failed deliveries to catch up.
    - cron: '7,27,47 0-2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only check without sending notifications
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: calendar-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/calendar_reminders.py ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        env:
          COUPLE_TELEGRAM_CONFIG: ${{ secrets.COUPLE_TELEGRAM_CONFIG }}
