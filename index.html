<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="2026-10-01-reward-notice-4">
<title>구마를 안은 행복한 토끼</title>
<link id="siteFavicon" rel="icon" type="image/png" href="combo-favicon-32.png">
<link id="siteAppleIcon" rel="apple-touch-icon" href="combo-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Noto Sans KR',sans-serif; min-height:100vh; }
  .top-banner{
    position:sticky; top:0; z-index:50;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    background:linear-gradient(180deg, #FFF6F8 0%, #FDF1EC 100%);
    border-bottom:1px solid rgba(0,0,0,.06);
    transition:background .5s ease;
  }
  .top-banner[data-mode="smoke"]{
    background:linear-gradient(180deg, #FFF8E8 0%, #FDF2DD 100%);
  }

  /* 미끄러지는 세그먼트 스위처 */
  .switcher{
    position:relative; display:flex; max-width:380px; margin-inline:auto;
    background:rgba(255,255,255,.72); border-radius:999px; padding:5px;
    box-shadow:0 2px 14px rgba(120,80,70,.14), inset 0 0 0 1px rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
  }
  .switcher .thumb{
    position:absolute; top:5px; bottom:5px; left:5px;
    width:calc(50% - 5px); border-radius:999px; z-index:0;
    background:linear-gradient(135deg, #FBD3DC, #F5AFC0);
    box-shadow:0 3px 10px rgba(226,142,164,.42);
    transition:transform .46s cubic-bezier(.5,1.42,.42,1), background .42s ease, box-shadow .42s ease;
  }
  .switcher[data-mode="smoke"] .thumb{
    transform:translateX(100%);
    background:linear-gradient(135deg, #FCDFA4, #F6C46A);
    box-shadow:0 3px 10px rgba(216,166,80,.46);
  }
  .seg{
    position:relative; z-index:1; flex:1; border:0; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px 6px; border-radius:999px;
    font-family:'Gaegu',cursive; font-size:16.5px; font-weight:700;
    color:#A08C86; transition:color .3s ease, transform .2s cubic-bezier(.34,1.4,.64,1);
    -webkit-tap-highlight-color:transparent;
  }
  .seg[aria-selected="true"]{ color:#5A3B38; }
  .seg:active{ transform:scale(.96); }
  .seg:focus-visible{ outline:2px solid #C98BA0; outline-offset:2px; }
  .seg img{
    width:26px; height:26px; border-radius:50%; object-fit:cover; display:block;
    box-shadow:0 1px 4px rgba(0,0,0,.18);
    transition:transform .46s cubic-bezier(.4,1.5,.5,1), filter .3s ease;
    filter:saturate(.55) opacity(.75);
  }
  .seg[aria-selected="true"] img{
    filter:none;
    transform:scale(1.12) rotate(-6deg);
  }
  @media (max-width:360px){
    .seg{ font-size:15px; gap:5px; }
    .seg img{ width:23px; height:23px; }
  }

  .app-panel{ min-height:100vh; }
  .app-panel.enter{ animation:panelIn .42s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(10px) scale(.994); }
    to{ opacity:1; transform:none; }
  }

  /* 전환 시 잠깐 뜨는 아이콘 */
  .splash{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0;
  }
  .splash.show{ animation:splashFade .78s ease both; }
  .splash .glyph{
    width:128px; height:128px; border-radius:28px; display:block;
    object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .splash.show .glyph{ animation:glyphPop .78s cubic-bezier(.3,1.4,.5,1) both; }
  .splash .label{
    position:absolute; bottom:calc(50% - 104px);
    font-family:'Gaegu',cursive; font-size:17px; font-weight:700;
    color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .splash.show .label{ animation:labelFade .78s ease both; }
  @keyframes splashFade{
    0%{ opacity:0; backdrop-filter:blur(0px); background:rgba(20,22,26,0); }
    18%{ opacity:1; backdrop-filter:blur(7px); background:rgba(20,22,26,.46); }
    62%{ opacity:1; backdrop-filter:blur(7px); background:rgba(20,22,26,.46); }
    100%{ opacity:0; backdrop-filter:blur(0px); background:rgba(20,22,26,0); }
  }
  @keyframes glyphPop{
    0%{ transform:scale(.4) rotate(-14deg); opacity:0; }
    30%{ transform:scale(1.14) rotate(3deg); opacity:1; }
    45%{ transform:scale(1) rotate(0deg); }
    70%{ transform:scale(1) rotate(0deg); opacity:1; }
    100%{ transform:scale(1.18); opacity:0; }
  }
  @keyframes labelFade{
    0%{ opacity:0; transform:translateY(8px); }
    28%{ opacity:1; transform:none; }
    68%{ opacity:1; transform:none; }
    100%{ opacity:0; transform:translateY(-4px); }
  }

  /* 카드가 자연스럽게 떠오르도록 */
  #app-leave .card, #app-smoke .card{
    animation:cardRise .34s ease both;
  }
  @keyframes cardRise{
    from{ opacity:0; transform:translateY(7px); }
    to{ opacity:1; transform:none; }
  }
  #app-leave button, #app-smoke button{
    transition:transform .16s cubic-bezier(.34,1.3,.64,1), filter .16s ease;
  }
  #app-leave button:active, #app-smoke button:active{ transform:scale(.96); }

  /* ── 성공 토스트 (체크 그려지는 연출) ── */
  .fx-toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(14px);
    z-index:300; display:flex; align-items:center; gap:10px;
    padding:13px 20px 13px 15px; border-radius:999px;
    background:rgba(32,28,34,.93); color:#fff; font-size:14px; font-weight:600;
    box-shadow:0 8px 28px rgba(0,0,0,.3); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; max-width:calc(100vw - 32px);
  }
  .fx-toast.show{ animation:toastIn 2.6s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes toastIn{
    0%{ opacity:0; transform:translateX(-50%) translateY(16px) scale(.94); }
    9%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    88%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-8px) scale(.98); }
  }
  .fx-toast svg{ width:22px; height:22px; flex-shrink:0; }
  .fx-toast .ring{ stroke:#6FD08C; stroke-width:2.2; fill:none; stroke-dasharray:63; stroke-dashoffset:63; }
  .fx-toast .tick{ stroke:#6FD08C; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:22; stroke-dashoffset:22; }
  .fx-toast.show .ring{ animation:drawRing .5s ease-out .06s forwards; }
  .fx-toast.show .tick{ animation:drawTick .34s ease-out .42s forwards; }
  @keyframes drawRing{ to{ stroke-dashoffset:0; } }
  @keyframes drawTick{ to{ stroke-dashoffset:0; } }
  .fx-toast.warn{ background:rgba(60,32,30,.94); }
  .fx-toast.warn .ring, .fx-toast.warn .tick{ stroke:#F0A868; }

  /* ── 컨페티 ── */
  .fx-confetti{ position:fixed; inset:0; z-index:290; pointer-events:none; overflow:hidden; }
  .fx-confetti i{
    position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
    animation:confFall linear forwards;
  }
  @keyframes confFall{
    0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(102vh) rotate(760deg); opacity:.9; }
  }

  /* ── 숫자 굴러가기 ── */
  .num-roll{ display:inline-block; transition:transform .2s ease; }
  .num-roll.bump{ animation:numBump .5s cubic-bezier(.3,1.5,.5,1); }
  @keyframes numBump{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.22); }
    100%{ transform:scale(1); }
  }

  /* ── 도장: 반동 + 잉크 번짐 ── */
  #app-leave .stamp, #app-smoke .stamp{ animation:stampHit .62s cubic-bezier(.2,1.4,.4,1) both !important; }
  @keyframes stampHit{
    0%{ transform:rotate(-16deg) scale(3); opacity:0; }
    42%{ transform:rotate(-16deg) scale(.82); opacity:1; }
    54%{ transform:rotate(-13deg) scale(1.13); }
    64%{ transform:rotate(-15deg) scale(.95); }
    74%{ transform:rotate(-13deg) scale(1.05); }
    86%{ transform:rotate(-14deg) scale(.99); }
    100%{ transform:rotate(-14deg) scale(1); opacity:1; }
  }
  .stamp-ink{
    position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%;
    transform:translate(-50%,-50%); pointer-events:none;
    border:2px solid currentColor; opacity:.55;
    animation:inkSpread .72s ease-out .24s both;
  }
  @keyframes inkSpread{
    0%{ width:10px; height:10px; opacity:.6; }
    100%{ width:92px; height:92px; opacity:0; }
  }

  /* ── 타이머 ── */
  #app-smoke .timer-num{ transition:color .4s ease; }
  #app-smoke .timer-num.tick{ animation:tickBeat .5s ease-out; }
  @keyframes tickBeat{
    0%{ transform:scale(1); }
    22%{ transform:scale(1.045); }
    100%{ transform:scale(1); }
  }
  #app-smoke .timer-num.urgent{ color:#D96C7A; animation:pulseBeat 1s ease-in-out infinite; }
  @keyframes pulseBeat{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.07); opacity:.82; }
  }

  /* ── 목록 항목 등장 ── */
  #app-leave .card, #app-smoke .card{ animation:cardRise .34s ease both; }

  /* ── 대기 배지 통통 ── */
  .count-pop{ animation:badgePop .55s cubic-bezier(.3,1.6,.5,1); display:inline-block; }
  @keyframes badgePop{
    0%{ transform:scale(.3); opacity:0; }
    55%{ transform:scale(1.3); opacity:1; }
    100%{ transform:scale(1); }
  }

  /* ── 세그먼트 아이콘 숨쉬기 ── */
  .seg[aria-selected="true"] img{ animation:breathe 3.6s ease-in-out 1.2s infinite; }
  @keyframes breathe{
    0%,100%{ transform:scale(1.12) rotate(-6deg); }
    50%{ transform:scale(1.18) rotate(-2deg); }
  }

  /* ── 연기 (시간 초과) ── */
  .fx-smoke{ position:fixed; inset:0; z-index:285; pointer-events:none; overflow:hidden; }
  .fx-smoke i{
    position:absolute; bottom:-40px; border-radius:50%;
    background:radial-gradient(circle, rgba(220,220,225,.55), rgba(220,220,225,0) 70%);
    animation:smokeUp 3.4s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ transform:translateY(0) scale(.5); opacity:0; }
    15%{ opacity:.75; }
    100%{ transform:translateY(-78vh) scale(2.3); opacity:0; }
  }

  /* ── 첫 로딩 스플래시 ── */
  .boot{
    position:fixed; inset:0; z-index:400;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:linear-gradient(170deg,#FFF6F8,#FDF1EC);
    animation:bootOut .5s ease 1.25s forwards;
  }
  .boot img{
    width:104px; height:104px; border-radius:26px; object-fit:cover;
    box-shadow:0 12px 34px rgba(160,110,120,.3);
    animation:bootPop .8s cubic-bezier(.3,1.5,.5,1) both;
  }
  .boot .t{
    font-family:'Gaegu',cursive; font-size:19px; font-weight:700; color:#7B5E58;
    animation:bootFade .7s ease .22s both;
  }
  .boot .greet{
    font-size:13.5px; color:#8A716B; text-align:center; padding:0 28px; line-height:1.6;
    animation:bootFade .7s ease .4s both;
  }
  html[data-theme="dark"] .boot .greet{ color:#A8958F; }
  .boot .bar{ width:92px; height:3px; border-radius:2px; background:rgba(0,0,0,.08); overflow:hidden; }
  .boot .bar i{ display:block; height:100%; width:40%; border-radius:2px; background:#F0A9BC; animation:bootBar 1.25s ease-in-out infinite; }
  @keyframes bootPop{
    0%{ transform:scale(.55) rotate(-10deg); opacity:0; }
    60%{ transform:scale(1.08) rotate(3deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  @keyframes bootFade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @keyframes bootBar{ 0%{transform:translateX(-120%);} 100%{transform:translateX(320%);} }
  @keyframes bootOut{ to{ opacity:0; visibility:hidden; } }

  /* ── 스켈레톤 로딩 ── */
  .skel{ padding:4px 0; }
  .skel .line{
    height:13px; border-radius:7px; margin:9px 0;
    background:linear-gradient(90deg, rgba(0,0,0,.055) 25%, rgba(0,0,0,.1) 37%, rgba(0,0,0,.055) 63%);
    background-size:400% 100%;
    animation:shimmer 1.35s ease-in-out infinite;
  }
  .skel .line.w60{ width:60%; } .skel .line.w40{ width:40%; } .skel .line.w85{ width:85%; }
  .skel .line.tall{ height:34px; border-radius:11px; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  /* ── 상태 배지 전환 ── */
  .status{ transition:background .55s ease, color .55s ease; }
  .status.just-changed{ animation:statusWash .85s ease both; }
  @keyframes statusWash{
    0%{ transform:scale(.86); filter:saturate(2.2) brightness(1.12); }
    40%{ transform:scale(1.12); }
    100%{ transform:scale(1); filter:none; }
  }

  /* ── 당겨서 새로고침 ── */
  .ptr{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    z-index:120; display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.95); box-shadow:0 3px 12px rgba(0,0,0,.16);
    opacity:0; pointer-events:none;
  }
  .ptr svg{ width:19px; height:19px; stroke:#C98BA0; stroke-width:2.4; fill:none; stroke-linecap:round; }
  .ptr.spin svg{ animation:ptrSpin .75s linear infinite; }
  @keyframes ptrSpin{ to{ transform:rotate(360deg); } }

  /* ── 고구마 뻐끔 (승인 시) ── */
  .puff{ position:fixed; inset:0; z-index:286; pointer-events:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  .puff img{
    width:116px; height:116px; border-radius:26px; object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    animation:puffPop 1.9s cubic-bezier(.3,1.3,.5,1) both;
  }
  @keyframes puffPop{
    0%{ transform:scale(.5) translateY(26px); opacity:0; }
    18%{ transform:scale(1.06) translateY(0); opacity:1; }
    30%{ transform:scale(1); }
    78%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1.1) translateY(-14px); opacity:0; }
  }
  .puff i{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(236,236,240,.8), rgba(236,236,240,0) 70%);
    animation:puffRise 1.9s ease-out forwards;
  }
  @keyframes puffRise{
    0%{ transform:translate(0,0) scale(.3); opacity:0; }
    25%{ opacity:.85; }
    100%{ transform:translate(var(--dx,20px), -190px) scale(2.4); opacity:0; }
  }

  /* ── 시무룩한 토끼 (연차 소진) ── */
  .sad-rabbit{ display:inline-block; animation:sadDroop 2.4s ease-in-out infinite; filter:grayscale(.45); }
  @keyframes sadDroop{
    0%,100%{ transform:rotate(-4deg) translateY(0); }
    50%{ transform:rotate(-7deg) translateY(3px); }
  }

  /* ── 이스터에그 ── */
  .egg-spin{ animation:eggSpin .9s cubic-bezier(.3,1.2,.4,1); }
  @keyframes eggSpin{
    0%{ transform:scale(1.12) rotate(-6deg); }
    40%{ transform:scale(1.5) rotate(190deg); }
    100%{ transform:scale(1.12) rotate(354deg); }
  }


  /* ── 다크모드 ── */
  html[data-theme="dark"] body{ background:#15161A; }
  html[data-theme="dark"] .top-banner{ background:linear-gradient(180deg,#242027,#1F1B21) !important; border-bottom-color:rgba(255,255,255,.07); }
  html[data-theme="dark"] .top-banner[data-mode="smoke"]{ background:linear-gradient(180deg,#242220,#1F1D1A) !important; }
  html[data-theme="dark"] .switcher{ background:rgba(255,255,255,.07); box-shadow:0 2px 14px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08); }
  html[data-theme="dark"] .seg{ color:#9A8E92; }
  html[data-theme="dark"] .seg[aria-selected="true"]{ color:#2A1F22; }
  html[data-theme="dark"] .boot{ background:linear-gradient(170deg,#1E1A20,#191519); }
  html[data-theme="dark"] .boot .t{ color:#D6C3C0; }
  html[data-theme="dark"] .boot .bar{ background:rgba(255,255,255,.1); }
  html[data-theme="dark"] .ptr{ background:rgba(45,40,46,.96); }
  html[data-theme="dark"] .skel .line{ background:linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.12) 37%, rgba(255,255,255,.06) 63%); background-size:400% 100%; }
  html[data-theme="dark"] #app-leave{
      --pink:#2E252B; --pink-deep:#3C3038; --cream:#15161A; --lavender:#9B86B8;
      --brown:#C0A99C; --ink:#EDE4E0; --muted:#938781;
      --stamp-red:#E08798; --stamp-black:#A99C95; --ok:#8FC894; --warn:#E0A860;
    }
  html[data-theme="dark"] #app-smoke{
      --sky:#20262B; --sky-deep:#2D363D; --cream:#15161A; --slate:#A9BAC3;
      --ink:#E6EDF0; --muted:#8A9AA3; --stamp-red:#E08798; --stamp-black:#A99C95; --ok:#7FC0B8;
    }
  html[data-theme="dark"] #app-leave .card, html[data-theme="dark"] #app-smoke .card{ background:#1E2025 !important; }
  html[data-theme="dark"] #app-leave .field input, html[data-theme="dark"] #app-leave .field textarea, html[data-theme="dark"] #app-leave .field select, html[data-theme="dark"] #app-smoke .field input, html[data-theme="dark"] #app-smoke .field textarea, html[data-theme="dark"] #app-smoke .field select{
      background:#23262C !important; color:var(--ink);
    }
  html[data-theme="dark"] #app-leave .status.pending{background:#4A3C1E; color:#E8C878;}
  html[data-theme="dark"] #app-leave .status.approved{background:#2B4430; color:#95D59C;}
  html[data-theme="dark"] #app-leave .status.rejected{background:#38332F; color:#BFB3AC;}
  html[data-theme="dark"] #app-smoke .status.pending{background:#4A3C1E; color:#E8C878;}
  html[data-theme="dark"] #app-smoke .status.approved{background:#2B4430; color:#95D59C;}
  html[data-theme="dark"] #app-smoke .status.rejected{background:#38332F; color:#BFB3AC;}
  html[data-theme="dark"] #app-leave .rules-box{ background:#2A2228 !important; }
  html[data-theme="dark"] .fx-toast{ background:rgba(48,44,52,.96); }

  .theme-btn{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(255,255,255,.72); box-shadow:0 2px 10px rgba(120,80,70,.16);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px); -webkit-tap-highlight-color:transparent;
    transition:transform .3s cubic-bezier(.34,1.4,.64,1), background .4s ease;
  }
  .theme-btn:active{ transform:translateY(-50%) scale(.9); }
  .theme-btn svg{ width:19px; height:19px; stroke:#8A6F6A; stroke-width:1.9; fill:none; stroke-linecap:round; }
  .theme-btn .moon{ display:none; }
  html[data-theme="dark"] .theme-btn{ background:rgba(255,255,255,.1); }
  html[data-theme="dark"] .theme-btn svg{ stroke:#E8D4B8; }
  html[data-theme="dark"] .theme-btn .moon{ display:block; }
  html[data-theme="dark"] .theme-btn .sun{ display:none; }
  .theme-btn.flip{ animation:themeFlip .55s cubic-bezier(.3,1.4,.5,1); }
  @keyframes themeFlip{
    0%{ transform:translateY(-50%) rotate(0) scale(1); }
    50%{ transform:translateY(-50%) rotate(180deg) scale(1.18); }
    100%{ transform:translateY(-50%) rotate(360deg) scale(1); }
  }
  .switcher{ max-width:min(380px, calc(100% - 56px)); }

  /* ── 승인 시 카드 뒤집기 ── */
  .card.flip-approve{ animation:cardFlip .8s cubic-bezier(.4,.9,.3,1) both; transform-style:preserve-3d; }
  @keyframes cardFlip{
    0%{ transform:perspective(900px) rotateX(0); }
    50%{ transform:perspective(900px) rotateX(-180deg); }
    100%{ transform:perspective(900px) rotateX(-360deg); }
  }

  /* ── 대기 중 카드 은은한 빛 ── */
  .glow-wait{ position:relative; }
  .glow-wait::after{
    content:''; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
    box-shadow:0 0 0 0 rgba(240,180,110,.55);
    animation:waitGlow 2.4s ease-in-out infinite;
  }
  @keyframes waitGlow{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,180,110,0); }
    50%{ box-shadow:0 0 18px 2px rgba(240,180,110,.42); }
  }

  /* ── 선물 반짝 (포상 연차) ── */
  .gift{ position:fixed; inset:0; z-index:288; pointer-events:none;
    display:flex; align-items:center; justify-content:center; }
  .gift .box{
    font-size:84px; animation:giftShake 2.1s cubic-bezier(.3,1.2,.4,1) both;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.3));
  }
  @keyframes giftShake{
    0%{ transform:scale(.4) rotate(0); opacity:0; }
    14%{ transform:scale(1.1) rotate(0); opacity:1; }
    24%{ transform:scale(1) rotate(-13deg); }
    34%{ transform:scale(1) rotate(13deg); }
    44%{ transform:scale(1) rotate(-10deg); }
    54%{ transform:scale(1) rotate(10deg); }
    64%{ transform:scale(1.22) rotate(0); }
    80%{ transform:scale(1.1) rotate(0); opacity:1; }
    100%{ transform:scale(1.5) rotate(0); opacity:0; }
  }
  .gift i{
    position:absolute; width:4px; height:4px; border-radius:50%; background:#FFD98A;
    box-shadow:0 0 8px 2px rgba(255,217,138,.85);
    animation:sparkOut 1.5s ease-out forwards;
  }
  @keyframes sparkOut{
    0%{ transform:translate(0,0) scale(0); opacity:0; }
    20%{ opacity:1; transform:scale(1.6); }
    100%{ transform:translate(var(--sx,0), var(--sy,0)) scale(.2); opacity:0; }
  }

  /* ── 화면 가장자리 빛 번짐 ── */
  .edge-flash{
    position:fixed; inset:0; z-index:284; pointer-events:none;
    animation:edgeFlash .9s ease-out forwards;
  }
  @keyframes edgeFlash{
    0%{ box-shadow:inset 0 0 0 0 var(--fc, rgba(130,200,150,.8)); opacity:0; }
    22%{ box-shadow:inset 0 0 70px 14px var(--fc, rgba(130,200,150,.8)); opacity:1; }
    100%{ box-shadow:inset 0 0 0 0 var(--fc, rgba(130,200,150,0)); opacity:0; }
  }

  /* ── 버튼 물결 ── */
  .ripple{ position:absolute; border-radius:50%; transform:translate(-50%,-50%);
    background:rgba(255,255,255,.55); pointer-events:none;
    animation:rippleOut .62s ease-out forwards; }
  @keyframes rippleOut{
    0%{ width:0; height:0; opacity:.7; }
    100%{ width:260px; height:260px; opacity:0; }
  }
  #app-leave button, #app-smoke button, .seg, .theme-btn{ position:relative; overflow:hidden; }

  /* ── 타이머 원형 게이지 ── */
  .ring-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-wrap .track{ stroke:rgba(0,0,0,.08); fill:none; stroke-width:7; }
  .ring-wrap .prog{ stroke:var(--ok,#6FA8A0); fill:none; stroke-width:7; stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .5s ease; }
  .ring-wrap.urgent .prog{ stroke:#D96C7A; }
  .ring-wrap .inside{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  html[data-theme="dark"] .ring-wrap .track{ stroke:rgba(255,255,255,.1); }

  /* ── 숫자 깜빡 ── */
  .flash-in{ animation:flashIn .5s ease both; }
  @keyframes flashIn{
    0%{ opacity:0; transform:translateY(-6px) scale(.9); }
    60%{ transform:translateY(0) scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* iOS 입력 시 자동 확대 방지 — 16px 미만이면 확대됨 */
  #app-leave input, #app-leave textarea, #app-leave select,
  #app-smoke input, #app-smoke textarea, #app-smoke select{
    font-size:16px !important;
  }

  /* iOS date/time 입력칸이 넘치지 않도록 */
  #app-leave input[type="date"], #app-leave input[type="time"],
  #app-smoke input[type="date"], #app-smoke input[type="time"]{
    -webkit-appearance:none; appearance:none;
    min-width:0; max-width:100%; width:100%;
  }
  #app-leave .row2, #app-smoke .row2{ min-width:0; }
  #app-leave .row2 > div, #app-smoke .row2 > div{ min-width:0; flex:1 1 0; }
  #app-leave .field, #app-smoke .field{ min-width:0; }
  #app-leave main, #app-smoke main{ overflow-x:hidden; }

  /* ── 입력칸 포커스 ── */
  #app-leave .field input:focus, #app-leave .field textarea:focus, #app-leave .field select:focus,
  #app-smoke .field input:focus, #app-smoke .field textarea:focus, #app-smoke .field select:focus{
    outline:none;
    border-color:var(--lavender, var(--slate));
    box-shadow:0 0 0 3px rgba(160,140,200,.16);
    transition:border-color .2s, box-shadow .2s;
  }
  #app-smoke .field input:focus, #app-smoke .field textarea:focus, #app-smoke .field select:focus{
    box-shadow:0 0 0 3px rgba(120,160,185,.16);
  }

  /* ── 체크박스 ── */
  #app-leave input[type="checkbox"], #app-smoke input[type="checkbox"]{
    accent-color:var(--lavender, #9BB7C9);
    transition:transform .18s cubic-bezier(.34,1.5,.64,1);
  }
  #app-leave input[type="checkbox"]:checked, #app-smoke input[type="checkbox"]:checked{
    transform:scale(1.14);
  }

  /* ── 카드 순차 등장 ── */
  #app-leave .card:nth-child(1), #app-smoke .card:nth-child(1){ animation-delay:0s; }
  #app-leave .card:nth-child(2), #app-smoke .card:nth-child(2){ animation-delay:.05s; }
  #app-leave .card:nth-child(3), #app-smoke .card:nth-child(3){ animation-delay:.1s; }
  #app-leave .card:nth-child(4), #app-smoke .card:nth-child(4){ animation-delay:.15s; }
  #app-leave .card:nth-child(5), #app-smoke .card:nth-child(5){ animation-delay:.2s; }

  /* ── 비활성 버튼 ── */
  #app-leave button:disabled, #app-smoke button:disabled{
    opacity:.55; cursor:not-allowed; filter:grayscale(.3);
  }
  #app-leave button:disabled:active, #app-smoke button:disabled:active{ transform:none; }

  /* ── 토스트 겹침 방지 ── */
  .fx-toast{ bottom:calc(34px + env(safe-area-inset-bottom, 0px)); }

  /* ── 스크롤바 ── */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.16); border-radius:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); }

  /* ── 텍스트 선택 색 ── */
  ::selection{ background:rgba(245,175,192,.4); }

  /* ── 스크롤 시 헤더 그림자 ── */
  .top-banner{ transition:background .5s ease, box-shadow .3s ease; }
  .top-banner.scrolled{ box-shadow:0 4px 18px rgba(0,0,0,.1); }
  html[data-theme="dark"] .top-banner.scrolled{ box-shadow:0 4px 18px rgba(0,0,0,.4); }

  /* ── 버튼 길게 눌러도 선택 안 되게 ── */
  .seg, .theme-btn, #app-leave button, #app-smoke button{
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }

  /* ── 라벨 간격 다듬기 ── */
  #app-leave .field label, #app-smoke .field label{ letter-spacing:.01em; }

  /* ── 상태 배지 글꼴 통일 ── */
  .status, .badge{ font-variant-numeric:tabular-nums; }

  /* ── 타이머 숫자 자릿수 흔들림 방지 ── */
  #app-smoke .timer-num{ font-variant-numeric:tabular-nums; }

  /* ── 카드 눌림 ── */
  #app-leave .card, #app-smoke .card{ transition:box-shadow .25s ease; }

  /* ── 탭 썸 이동 시 잔상 ── */
  .switcher .thumb::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:inherit; opacity:0; filter:blur(10px);
    transition:opacity .4s ease;
  }
  .switcher.moving .thumb::after{ opacity:.55; }

  /* ── 삭제/취소 시 사라지는 애니메이션 ── */
  .vanish{ animation:vanishOut .4s cubic-bezier(.5,0,.75,0) both; }
  @keyframes vanishOut{
    0%{ opacity:1; transform:translateX(0) scale(1); max-height:400px; }
    60%{ opacity:0; transform:translateX(-36px) scale(.94); }
    100%{ opacity:0; transform:translateX(-36px) scale(.9); max-height:0; margin:0; padding-top:0; padding-bottom:0; }
  }

  /* ── 확인 대기 버튼 ── */
  .btn-ghost[data-confirming="1"], .action[data-confirming="1"]{
    animation:confirmPulse 1s ease-in-out infinite;
  }
  @keyframes confirmPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(217,108,122,.4); }
    50%{ box-shadow:0 0 0 7px rgba(217,108,122,0); }
  }

  /* ── 시작 버튼 숨쉬기 ── */
  #S-startBtn{ animation:readyBreathe 2.2s ease-in-out infinite; }
  @keyframes readyBreathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(111,168,160,.45); transform:scale(1); }
    50%{ box-shadow:0 0 0 9px rgba(111,168,160,0); transform:scale(1.012); }
  }

  /* ── 잔여 연차 게이지 ── */
  .balance-bar{
    height:6px; border-radius:3px; background:rgba(0,0,0,.07);
    overflow:hidden; margin:10px auto 0; max-width:180px;
  }
  .balance-bar i{
    display:block; height:100%; border-radius:3px;
    background:linear-gradient(90deg,#F5AFC0,#E890AC);
    transition:width .9s cubic-bezier(.3,1,.4,1);
  }
  html[data-theme="dark"] .balance-bar{ background:rgba(255,255,255,.1); }

  /* ── 월별 격자: 오늘 표시 & 최다일 ── */
  .month-grid .d.today{ outline:2px solid var(--slate,#8899A5); outline-offset:-2px; font-weight:700; }
  .month-grid .d.best{ position:relative; }
  .month-grid .d.best::after{
    content:'\2605'; position:absolute; top:-3px; right:-1px; font-size:8px; color:#E0A860;
  }

  /* ── 사진 열릴 때 ── */
  #app-smoke img[data-photo-img]{ animation:photoIn .4s ease both; }
  @keyframes photoIn{
    from{ opacity:0; transform:scale(.96) translateY(-4px); }
    to{ opacity:1; transform:none; }
  }

  /* ── 섹션 제목 포인트 ── */
  #app-leave .card h2, #app-smoke .card h2{ position:relative; padding-left:11px; }
  #app-leave .card h2::before, #app-smoke .card h2::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:15px; border-radius:2px; background:var(--lavender, var(--slate)); opacity:.65;
  }

  /* ── 빈 목록 숨쉬기 ── */
  #app-leave .empty, #app-smoke .empty{ animation:emptyFade 2.8s ease-in-out infinite; }
  @keyframes emptyFade{ 0%,100%{opacity:.62;} 50%{opacity:.95;} }

  /* ── 스탬프 그림자 ── */
  #app-leave .stamp, #app-smoke .stamp{ text-shadow:0 1px 2px rgba(0,0,0,.08); }

  /* ── 시무룩 캐릭터 (반려) ── */
  .sad{ position:fixed; inset:0; z-index:287; pointer-events:none;
    display:flex; align-items:center; justify-content:center; }
  .sad img{
    width:116px; height:116px; border-radius:26px; object-fit:cover;
    box-shadow:0 10px 28px rgba(0,0,0,.26);
    animation:sadSlump 2.1s cubic-bezier(.4,.9,.5,1) both;
  }
  @keyframes sadSlump{
    0%{ transform:scale(.6) translateY(-18px) rotate(0); opacity:0; filter:grayscale(0); }
    18%{ transform:scale(1.04) translateY(0) rotate(0); opacity:1; }
    32%{ transform:scale(1) translateY(6px) rotate(-7deg); filter:grayscale(.5); }
    46%{ transform:scale(.99) translateY(10px) rotate(-11deg); }
    60%{ transform:scale(.99) translateY(8px) rotate(-8deg); }
    74%{ transform:scale(.98) translateY(12px) rotate(-12deg); filter:grayscale(.65); }
    88%{ transform:scale(.97) translateY(14px) rotate(-11deg); opacity:1; }
    100%{ transform:scale(.9) translateY(26px) rotate(-11deg); opacity:0; filter:grayscale(.7); }
  }
  .sad i{
    position:absolute; font-size:19px; opacity:0;
    animation:dropFall 2.1s ease-in forwards;
  }
  @keyframes dropFall{
    0%{ transform:translate(0,0) scale(.5); opacity:0; }
    26%{ opacity:.9; transform:translate(0,10px) scale(1); }
    100%{ transform:translate(var(--dx,0), 130px) scale(.85); opacity:0; }
  }
  .sad .cloud{
    position:absolute; top:calc(50% - 118px); left:50%; transform:translateX(-50%);
    font-size:40px; opacity:0;
    animation:cloudIn 2.1s ease-out both;
  }
  @keyframes cloudIn{
    0%{ opacity:0; transform:translateX(-50%) translateY(14px) scale(.7); }
    24%{ opacity:.9; transform:translateX(-50%) translateY(0) scale(1); }
    82%{ opacity:.9; }
    100%{ opacity:0; transform:translateX(-50%) translateY(-8px) scale(1.05); }
  }

  /* ── 스플래시 아이콘 빛 번짐 ── */
  .boot img{ position:relative; }
  .boot::before{
    content:''; position:absolute; top:50%; left:50%;
    width:230px; height:230px; margin:-140px 0 0 -115px; border-radius:50%;
    background:radial-gradient(circle, rgba(250,200,210,.5), rgba(250,200,210,0) 68%);
    animation:auraPulse 2.6s ease-in-out infinite;
  }
  @keyframes auraPulse{
    0%,100%{ transform:scale(.9); opacity:.55; }
    50%{ transform:scale(1.08); opacity:.85; }
  }
  html[data-theme="dark"] .boot::before{
    background:radial-gradient(circle, rgba(180,140,160,.3), rgba(180,140,160,0) 68%);
  }

  /* ── 제출 버튼 광택 ── */
  #L-submitBtn:not(:disabled)::before, #S-submitBtn::before{
    content:''; position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent);
    animation:sheen 3.4s ease-in-out 1.4s infinite;
  }
  @keyframes sheen{
    0%{ left:-60%; } 28%{ left:120%; } 100%{ left:120%; }
  }

  /* ── 결재함 열릴 때 ── */
  .unlock-in{ animation:unlockIn .55s cubic-bezier(.3,1.2,.4,1) both; }
  @keyframes unlockIn{
    0%{ opacity:0; transform:translateY(12px) scale(.97); filter:blur(3px); }
    100%{ opacity:1; transform:none; filter:none; }
  }

  /* ── 날짜가 오늘이면 강조 ── */
  .today-tag{
    display:inline-block; margin-left:5px; padding:1px 7px; border-radius:999px;
    font-size:10px; font-weight:700; background:var(--accent, #E0A860); color:#fff;
    animation:todayBlink 2.4s ease-in-out infinite;
  }
  @keyframes todayBlink{ 0%,100%{opacity:.85;} 50%{opacity:1;} }

  /* ── 사진 썸네일 둥글게 + 확대 ── */
  #app-smoke img[data-photo-img]{ cursor:zoom-in; transition:transform .3s ease; }
  #app-smoke img[data-photo-img]:active{ transform:scale(.985); }

  /* ── 선택 중인 라디오/시간 강조 ── */
  #app-smoke select:focus{ box-shadow:0 0 0 3px rgba(120,160,185,.2); }

  /* ── 로딩 바 색 전환 ── */
  .boot .bar i{ background:linear-gradient(90deg,#F0A9BC,#F6C46A,#F0A9BC); background-size:200% 100%;
    animation:bootBar 1.25s ease-in-out infinite, barHue 2.4s linear infinite; }
  @keyframes barHue{ 0%{background-position:0 0;} 100%{background-position:200% 0;} }

  /* ── 토스트 아이콘 통통 ── */
  .fx-toast.show svg{ animation:toastIconPop .5s cubic-bezier(.3,1.5,.5,1) .05s both; }
  @keyframes toastIconPop{
    0%{ transform:scale(.4); } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); }
  }

  /* ── 상단 요약 띠 숫자 강조 ── */
  .daily-strip b{ color:var(--accent,#C98BA0); font-weight:700; }

  /* ── 유흥연차 달력 ── */
  .cal{
    border:1.5px solid var(--pink-deep,#F0C9CF); border-radius:14px;
    padding:12px; background:#fff;
  }
  html[data-theme="dark"] .cal{ background:#1E2025; border-color:#3C3038; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .cal-head .mon{ font-family:'Gaegu',cursive; font-size:17px; font-weight:700; }
  .cal-head button{
    border:0; background:rgba(0,0,0,.05); border-radius:9px; width:30px; height:30px;
    cursor:pointer; font-size:15px; color:inherit; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  html[data-theme="dark"] .cal-head button{ background:rgba(255,255,255,.08); }
  .cal-head button:disabled{ opacity:.3; cursor:not-allowed; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-grid .dow{
    text-align:center; font-size:10.5px; color:var(--muted,#A6968D); padding-bottom:3px;
  }
  .cal-grid .dow.sun{ color:#E08798; }
  .cal-grid .dow.sat{ color:#8FA8D8; }
  .cal-day{
    aspect-ratio:1; border:0; background:transparent; border-radius:10px; cursor:pointer;
    font-family:'Noto Sans KR',sans-serif; font-size:13px; color:inherit;
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:background .18s ease, transform .18s cubic-bezier(.34,1.4,.64,1), color .18s;
  }
  .cal-day:hover:not(:disabled){ background:rgba(0,0,0,.05); }
  html[data-theme="dark"] .cal-day:hover:not(:disabled){ background:rgba(255,255,255,.07); }
  .cal-day:active:not(:disabled){ transform:scale(.9); }
  .cal-day:disabled{ opacity:.26; cursor:not-allowed; }
  .cal-day.sun{ color:#E08798; }
  .cal-day.sat{ color:#8FA8D8; }
  .cal-day.today::after{
    content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--lavender,#C9B7E0);
  }
  .cal-day.picked{
    background:linear-gradient(135deg,#FBD3DC,#F5AFC0) !important; color:#5A3B38 !important;
    font-weight:700; box-shadow:0 3px 10px rgba(226,142,164,.4);
    animation:pickPop .4s cubic-bezier(.3,1.5,.5,1);
  }
  .cal-day.picked::after{ background:#5A3B38; }
  @keyframes pickPop{
    0%{ transform:scale(.7); } 55%{ transform:scale(1.18); } 100%{ transform:scale(1); }
  }
  .cal-note{ font-size:11px; color:var(--muted,#A6968D); margin-top:8px; text-align:center; }

  /* ── 결재 대기 개수 뱃지 ── */
  .pending-dot{
    position:absolute; top:6px; right:9px; width:8px; height:8px; border-radius:50%;
    background:#E8734E; box-shadow:0 0 0 2px rgba(255,255,255,.85);
    animation:dotPing 1.8s ease-out infinite;
  }
  @keyframes dotPing{
    0%{ box-shadow:0 0 0 0 rgba(232,115,78,.55), 0 0 0 2px rgba(255,255,255,.85); }
    70%{ box-shadow:0 0 0 9px rgba(232,115,78,0), 0 0 0 2px rgba(255,255,255,.85); }
    100%{ box-shadow:0 0 0 0 rgba(232,115,78,0), 0 0 0 2px rgba(255,255,255,.85); }
  }

  /* ── 긴 글 줄바꿈 ── */
  #app-leave .req-reason, #app-smoke .req-reason{ overflow-wrap:anywhere; }

  /* ── 신나는 토끼 ── */
  .happy{ position:fixed; inset:0; z-index:287; pointer-events:none;
    display:flex; align-items:center; justify-content:center; }
  .happy img{
    width:120px; height:120px; border-radius:27px; object-fit:cover;
    box-shadow:0 12px 32px rgba(0,0,0,.3);
    animation:hop 1.9s cubic-bezier(.3,1.3,.5,1) both;
  }
  @keyframes hop{
    0%{ transform:scale(.5) translateY(40px) rotate(-10deg); opacity:0; }
    16%{ transform:scale(1.08) translateY(0) rotate(4deg); opacity:1; }
    30%{ transform:scale(1) translateY(-26px) rotate(-5deg); }
    42%{ transform:scale(1) translateY(0) rotate(3deg); }
    54%{ transform:scale(1) translateY(-18px) rotate(-4deg); }

<script>
/* ── 공용 연출 도구 ── */
window.FX = (function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function toast(msg, kind){
    var box = document.getElementById('fxToast');
    if(!box){
      box = document.createElement('div');
      box.id = 'fxToast';
      box.className = 'fx-toast';
      box.innerHTML = '<svg viewBox="0 0 24 24"><circle class="ring" cx="12" cy="12" r="10"/>'+
        '<path class="tick" d="M7.2 12.4l3.2 3.2 6.4-6.8"/></svg><span></span>';
      document.body.appendChild(box);
    }
    box.querySelector('span').textContent = msg;
    box.className = 'fx-toast' + (kind==='warn' ? ' warn' : '');
    void box.offsetWidth;
    box.classList.add('show');
    clearTimeout(box._t);
    box._t = setTimeout(function(){ box.classList.remove('show'); }, 2700);
  }

  function confetti(){
    if(reduce) return;
    var colors = ['#F5AFC0','#F6C46A','#9BD3A6','#A7BEE8','#E8A7D8','#FBD3DC'];
    var layer = document.createElement('div');
    layer.className = 'fx-confetti';
    for(var i=0;i<60;i++){
      var p = document.createElement('i');
      p.style.left = Math.random()*100+'vw';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.9 + Math.random()*1.5)+'s';
      p.style.animationDelay = (Math.random()*0.5)+'s';
      p.style.transform = 'rotate('+(Math.random()*360)+'deg)';
      if(Math.random() > .6){ p.style.borderRadius = '50%'; p.style.height = '9px'; }
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 4200);
  }

  function smoke(){
    if(reduce) return;
    var layer = document.createElement('div');
    layer.className = 'fx-smoke';
    for(var i=0;i<14;i++){
      var p = document.createElement('i');
      var size = 50 + Math.random()*90;
      p.style.width = size+'px';
      p.style.height = size+'px';

  function rollNumber(elx, from, to, unit){
    if(!elx) return;
    unit = unit || '';
    if(reduce || from === to){ elx.textContent = to + unit; return; }
    var start = performance.now(), dur = 620;
    elx.classList.add('bump');
    setTimeout(function(){ elx.classList.remove('bump'); }, 520);
    function step(now){
      var t = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      var val = from + (to - from) * eased;
      elx.textContent = (Math.round(val*10)/10) + unit;
      if(t < 1) requestAnimationFrame(step);
      else elx.textContent = to + unit;
    }
    requestAnimationFrame(step);
  }

    if(reduce || !stampEl) return;

    stampEl.appendChild(ink);
    setTimeout(function(){ ink.remove(); }, 1000);
  }

  function pop(elx){
    if(reduce || !elx) return;
    elx.classList.remove('count-pop');
    void elx.offsetWidth;
    elx.classList.add('count-pop');
  }

  function haptic(pattern){
    try{ if(navigator.vibrate) navigator.vibrate(pattern || 12); }catch(e){}
  }

  /* 고구마가 한 모금 뻐끔 */
  function puff(iconSrc){
    if(reduce) return;
    var layer = document.createElement('div');
    layer.className = 'puff';
    var img = document.createElement('img');
    img.src = iconSrc;
    layer.appendChild(img);
    for(var i=0;i<9;i++){
      var p = document.createElement('i');
      var s = 26 + Math.random()*46;
      p.style.width = s+'px'; p.style.height = s+'px';
      p.style.left = 'calc(50% + '+(-30 + Math.random()*60)+'px)';
      p.style.top = 'calc(50% - '+(10 + Math.random()*30)+'px)';
      p.style.setProperty('--dx', (-40 + Math.random()*80)+'px');
      p.style.animationDelay = (0.25 + Math.random()*0.7)+'s';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 2200);
  }

  function skeleton(lines){
    var n = lines || 3, html = '<div class="skel">';
    var widths = ['w60','w85','w40'];
    html += '<div class="line tall"></div>';
    for(var i=0;i<n;i++) html += '<div class="line '+widths[i%3]+'"></div>';
    return html + '</div>';
  }

  /* 신나는 토끼 */
  function happy(iconSrc){
    if(reduce) return;
    var layer = document.createElement('div');
    layer.className = 'happy';
    var img = document.createElement('img');
    img.src = iconSrc;
    layer.appendChild(img);
    var marks = ['\u2728','\ud83c\udf89','\ud83d\udcab','\u2764\ufe0f','\u2728'];
    for(var i=0;i<9;i++){
      var p = document.createElement('i');
      p.textContent = marks[i % marks.length];
      p.style.left = 'calc(50% + '+(-54 + Math.random()*108)+'px)';
      p.style.top = 'calc(50% - '+(Math.random()*30)+'px)';
      p.style.setProperty('--dx', (-56 + Math.random()*112)+'px');
      p.style.animationDelay = (0.15 + Math.random()*0.8)+'s';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 2200);
  }

  function greeting(name){
    var h = new Date().getHours();
    var when = h < 6 ? '늦은 밤이네요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '수고 많으셨어요';
    return when + ', ' + name + '님! 오늘도 파이팅 하자!';
  }

  /* 선물 상자 반짝 */
  function gift(){
    if(reduce) return;
    var layer = document.createElement('div');
    layer.className = 'gift';
    var box = document.createElement('div');
    box.className = 'box';
    box.textContent = '\ud83c\udf81';
    layer.appendChild(box);
    for(var i=0;i<22;i++){
      var s = document.createElement('i');
      var ang = (Math.PI*2) * (i/22);
      var dist = 90 + Math.random()*110;
      s.style.left = '50%'; s.style.top = '50%';
      s.style.setProperty('--sx', Math.cos(ang)*dist+'px');
      s.style.setProperty('--sy', Math.sin(ang)*dist+'px');
      s.style.animationDelay = (0.55 + Math.random()*0.35)+'s';
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 2300);
  }

  /* 화면 가장자리 빛 번짐 */
  function edgeFlash(color){
    if(reduce) return;
    var d = document.createElement('div');
    d.className = 'edge-flash';
    d.style.setProperty('--fc', color || 'rgba(130,200,150,.8)');
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 1000);
  }

  /* 버튼 물결 */
  function attachRipple(){
    document.addEventListener('click', function(e){
      var btn = e.target.closest('#app-leave button, #app-smoke button, .seg, .theme-btn');
      if(!btn || reduce) return;
      var r = btn.getBoundingClientRect();
      var w = document.createElement('span');
      w.className = 'ripple';
      w.style.left = (e.clientX - r.left)+'px';
      w.style.top = (e.clientY - r.top)+'px';
      btn.appendChild(w);
      setTimeout(function(){ w.remove(); }, 700);
    }, true);
  }

  /* 카드 뒤집기 */
  function flipCard(cardEl){
    if(reduce || !cardEl) return;
    cardEl.classList.remove('flip-approve');
    void cardEl.offsetWidth;
    cardEl.classList.add('flip-approve');
  }

  /* 아직 못 본 결재 결과가 있으면 알려줌 */
  function pickUnseen(key, items){
    var seen = {};
    try{ seen = JSON.parse(localStorage.getItem(key) || '{}'); }catch(e){}
    var fresh = [];
    var next = {};
    items.forEach(function(it){
      next[it.id] = it.status;
      if(seen[it.id] !== undefined && seen[it.id] !== it.status) fresh.push(it);
    });
    try{ localStorage.setItem(key, JSON.stringify(next)); }catch(e){}
    return fresh;
  }

  /* 시무룩한 캐릭터 */
  function sad(iconSrc){
    if(reduce) return;
    var layer = document.createElement('div');
    layer.className = 'sad';
    var cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.textContent = '\ud83c\udf27\ufe0f';
    layer.appendChild(cloud);
    var img = document.createElement('img');
    img.src = iconSrc;
    layer.appendChild(img);
    var marks = ['\ud83d\udca7','\ud83d\ude22','\ud83d\udca7'];
    for(var i=0;i<7;i++){
      var p = document.createElement('i');
      p.textContent = marks[i % marks.length];
      p.style.left = 'calc(50% + '+(-46 + Math.random()*92)+'px)';
      p.style.top = 'calc(50% - '+(20 + Math.random()*24)+'px)';
      p.style.setProperty('--dx', (-18 + Math.random()*36)+'px');
      p.style.animationDelay = (0.3 + Math.random()*0.8)+'s';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 2400);
  }

  function flashStatus(root){
    if(reduce || !root) return;
    root.querySelectorAll('.status').forEach(function(s){
      s.classList.remove('just-changed');
      void s.offsetWidth;
      s.classList.add('just-changed');
    });
  }

  return { toast:toast, confetti:confetti, smoke:smoke, rollNumber:rollNumber,
           inkSpread:inkSpread, pop:pop, haptic:haptic, puff:puff,
           skeleton:skeleton, flashStatus:flashStatus, happy:happy, greeting:greeting,
           gift:gift, edgeFlash:edgeFlash, flipCard:flipCard, attachRipple:attachRipple,
           pickUnseen:pickUnseen, sad:sad,
           COMBO_ICON:COMBO_ICON, ICONS:ICONS, reduce:reduce };
})();
</script>

#character-animation .ct-stamp-word{font:700 26px/1.1 'Gaegu',cursive;letter-spacing:2px}
#character-animation .ct-stamp small{font:500 9px/1.4 'Noto Sans KR',sans-serif;letter-spacing:1px;margin-top:4px}
#character-animation .ct-smoke-layer,#character-animation .ct-confetti-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
#character-animation .ct-puff{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle,#b9b9c17a 0,#c6c6cb55 36%,#ccccd100 72%);filter:blur(1px);transform:translate(-50%,-50%)}
#character-animation .ct-tear{position:absolute;width:9px;height:13px;border-radius:65% 0 60% 50%;background:linear-gradient(135deg,#cceffe,#65b9df);box-shadow:inset 2px 1px 0 #f0fcff;z-index:3;transform-origin:top}
#character-animation .ct-confetti{position:absolute;left:240px;top:248px;width:8px;height:13px;border-radius:2px}
#character-animation .ct-ember{position:absolute;width:14px;height:14px;left:20.5%;top:47.4%;border-radius:50%;background:radial-gradient(circle,#fffca6,#ff8f47 25%,#ee622600 70%);mix-blend-mode:screen}
#character-animation .ct-gift{position:absolute;left:360px;top:362px;font-size:60px;line-height:1;z-index:6}
#character-animation .ct-clock{position:absolute;width:70px;height:70px;left:35px;top:110px;border:5px solid #b29762;border-radius:50%;background:#fff9e7;box-shadow:inset 0 0 0 3px #e6d9b9,0 5px 12px #ad865325;z-index:6}
#character-animation .ct-clock::before{content:'';position:absolute;left:28px;top:12px;width:4px;height:22px;background:#907340;border-radius:2px;transform-origin:bottom;transform:rotate(-8deg)}
#character-animation .ct-clock::after{content:'';position:absolute;left:28px;top:30px;width:20px;height:4px;background:#907340;border-radius:2px;transform:rotate(35deg);transform-origin:left}
#character-animation .ct-playback{padding:12px 18px 15px;border-top:1px solid var(--ct-border);background:#fffdfa}
#character-animation .ct-progress-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ct-muted);margin-bottom:4px}
#character-animation [data-time]{font-variant-numeric:tabular-nums;white-space:nowrap}
#character-animation [data-seek]{display:block;width:100%;accent-color:var(--ct-pink);margin:6px 0 11px}
#character-animation .ct-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#character-animation button{font:500 12px/1.5 'Noto Sans KR',sans-serif;border:1px solid var(--ct-border);border-radius:11px;padding:9px 12px;background:#fffdfb;color:var(--ct-ink);transition:background .15s,border-color .15s}
#character-animation button:hover{background:#fff0f2;border-color:#e6bbc8}
#character-animation button[aria-pressed=true],#character-animation [data-toggle]{background:#805b64;color:#fff;border-color:#805b64}
#character-animation .ct-controls label{display:flex;align-items:center;gap:5px;color:var(--ct-muted);font-size:12px}
#character-animation select{font:inherit;color:var(--ct-ink);background:#fffdfb;border:1px solid var(--ct-border);border-radius:8px;padding:7px}
#character-animation input[type=checkbox]{accent-color:var(--ct-pink)}
#character-animation .ct-presets{margin-top:17px}
#character-animation h2{font:700 21px/1.3 'Gaegu',cursive;margin:0 0 9px}
#character-animation .ct-buttons{display:flex;flex-wrap:wrap;gap:7px}
#character-animation .ct-character-controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:17px}
#character-animation .ct-face-toggle{margin-top:18px}
#character-animation .ct-face-library{margin-top:16px;padding:14px;border:1px solid var(--ct-border);border-radius:18px;background:#fffaf6}
#character-animation .ct-face-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:15px}
#character-animation .ct-expression{text-align:center;font-size:11px;color:var(--ct-muted)}
#character-animation .ct-mini{position:relative;width:100%;aspect-ratio:1}
#character-animation .ct-error{padding:14px;color:#a44356;background:#fff1f2;border-radius:12px}
#character-animation .ct-site-details{margin-top:20px}
#character-animation .ct-stamp-samples{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#character-animation .ct-result-sample{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:1;min-width:190px;padding:6px 14px;background:#fffaf5;border:1px solid var(--ct-border);border-radius:14px}
#character-animation .ct-demo-feedback{display:block;margin-top:6px;font-size:12px;color:var(--ct-muted);overflow-wrap:anywhere}
@media(max-width:550px){#character-animation .ct-stage{height:410px}#character-animation .ct-heading h1{font-size:27px}#character-animation .ct-playback{padding:10px 12px 12px}#character-animation .ct-progress-label{align-items:flex-start}#character-animation .ct-character-controls{grid-template-columns:1fr;gap:12px}#character-animation .ct-face-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#character-animation button{min-height:42px;padding:9px 10px}#character-animation .ct-controls{gap:7px}#character-animation .ct-controls select{font-size:16px;max-width:112px}}

/* App-only overlay: shared scene artwork, without the preview controls. */
#character-animation {
  position:fixed;
  inset:0;
  z-index:295;
  max-width:none;
  margin:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  background:rgba(255,248,242,.42);
}
#character-animation .ct-stage {
  width:min(480px,100vw);
  height:min(565px,100dvh);
  background:transparent;
}
#character-animation .ct-stage::before { display:none; }
#character-animation .ct-caption { white-space:normal; }
html[data-theme="dark"] #character-animation { background:rgba(23,29,32,.6); }
html[data-theme="dark"] #character-animation .ct-caption { color:#fff0e6; }
html[data-theme="dark"] #character-animation .ct-speech { color:#f5b3c9;text-shadow:0 2px 8px #2a1724; }

<script id="character-animation-app">
/* Presentation only: no database, notifications, or application state writes. */
(function(global){
  'use strict';
  let active = null;
  let pending = [];
  const signature=entry=>entry.status+'|'+(entry.decidedAt || '');
  function readSeen(key){
    try{const value=JSON.parse(localStorage.getItem(key)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{};}catch{return {};}
  }
  function writeSeen(key,seen){try{localStorage.setItem(key,JSON.stringify(seen));}catch{}}
  function close(){
    if(!active)return;
    active.player.destroy();
    active.root.remove();
    active=null;
  }
  function show(scene, options = {}, job = null){
    if(!global.CharacterTheater.scenes[scene])return;
    close();
    const root=document.getElementById('character-animation-template').content.firstElementChild.cloneNode(true);
    root.setAttribute('role','status');
    root.setAttribute('aria-live','polite');
    root.setAttribute('aria-label',global.CharacterTheater.scenes[scene].label);
    document.body.appendChild(root);
    const player=global.CharacterTheater.mount(root,{
      scene,autoplay:true,fadeRoot:true,caption:options.caption,onComplete(){
        if(job){const seen=readSeen(job.key);seen[job.entry.id]=signature(job.entry);writeSeen(job.key,seen);}
        close();next();
      }
    });
    active={root,player,job};
  }
  function next(){
    if(active)return;
    while(pending.length){
      const job=pending.shift();
      if(!job.isVisible())continue;
      show(job.entry.scene,{caption:job.entry.caption},job);
      return;
    }
  }
  function dismiss(){pending=[];close();}
  function character(scene,options){dismiss();show(scene,options);}
  function presentResults(key,entries,isVisible){
    if(!isVisible())return;
    const seen=readSeen(key);
    let migrated=false;
    for(const entry of entries){
      if(!entry.id || !global.CharacterTheater.scenes[entry.scene])continue;
      const version=signature(entry);
      // Preserve previously viewed decisions from the earlier status-only cache.
      if(seen[entry.id]===entry.status){seen[entry.id]=version;migrated=true;}
      if(seen[entry.id]===version)continue;
      const same=job=>job&&job.key===key&&job.entry.id===entry.id&&signature(job.entry)===version;
      if(same(active?.job)||pending.some(same))continue;
      pending.push({key,entry,isVisible});
    }
    if(migrated)writeSeen(key,seen);
    next();
  }
  global.FX.character=character;
  global.FX.presentResults=presentResults;
  global.FX.leaveHistoryResults=history=>(history||[]).flatMap(entry=>{
    const match=String(entry.note||'').match(/^(포상 유흥연차 지급|유흥연차 차감):\s*([0-9.]+)일/);
    const kind=entry.kind || (match?(match[1]==='포상 유흥연차 지급'?'bonus':'penalty'):null);
    if(kind!=='bonus'&&kind!=='penalty')return [];
    const amount=Number(entry.amount ?? match?.[2]);
    if(!Number.isFinite(amount)||amount<=0)return [];
    return [{id:entry.id || String(entry.at)+'|'+entry.note,status:kind,decidedAt:entry.at,
      scene:kind==='bonus'?'gift':'rabbit-sad',caption:kind==='bonus'?`포상 유흥연차 +${amount}일`:`유흥연차 ${amount}일 차감됐어요`}];
  });
  global.FX.dismissCharacter=dismiss;
  // Never leave a paused animation covering the app after switching away.
  document.addEventListener('visibilitychange',()=>{if(document.hidden)dismiss();});
})(window);

</script>

function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}

function defaultState(){
  return {
    adminPasswordHash: null,
    balance: 2.5,
    lastResetYear: todayYear(),
    requests: [],
    history: [
      { note: "초기 보유 유흥연차 2.5일", at: new Date().toISOString() }
    ]
  };
}

async function saveState(){
  if(!stateRef){ console.error('stateRef 없음 - Firebase 초기화 실패'); return false; }
  try{
    await stateRef.set(state);
    return true;
  }catch(e){
    console.error(e);
    FX.alert("저장에 실패했어요. 인터넷 연결을 확인해주세요.");
    return false;
  }
}

function applyYearRollover(){
  const y = todayYear();
  if(state.lastResetYear < y){
    state.balance = ANNUAL_GRANT;
    state.history.unshift({
      note: `${y}년 유흥연차 갱신: ${ANNUAL_GRANT}일 부여 (전년도 미사용분은 이월되지 않음)`,
      at: new Date().toISOString()
    });
    state.lastResetYear = y;
    saveState();
  }
}

/* 실시간 동기화: 다른 기기에서 신청/결재하면 자동으로 화면이 갱신됨 */
const APPLICANT_FIELD_IDS = ['L-theDate','L-startTime','L-endTime','L-place','L-companion','L-ackCheck'];
const ADMIN_FIELD_IDS = ['L-bonusAmount','L-bonusReason','L-penaltyAmount','L-penaltyReason','L-pwInput','L-pw1','L-pw2'];

function captureDraft(ids){
  const d = {};
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx) d[id] = (elx.type === 'checkbox') ? elx.checked : elx.value;
  });
  return d;
}
function restoreDraft(ids, d){
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx && d[id] !== undefined){
      if(elx.type === 'checkbox') elx.checked = d[id];
      else elx.value = d[id];
    }
  });
}
let prevBalance = null;
function animateBalance(){
  const node = document.querySelector('#app-leave [data-balance]');
  if(!node) return;
  const now = state ? state.balance : null;
  if(now == null) return;
  if(prevBalance != null && prevBalance !== now){
    FX.rollNumber(node, prevBalance, now);
  }
  prevBalance = now;
}

function refreshCurrentView(){
  if(view === 'applicant'){
    const draft = captureDraft(APPLICANT_FIELD_IDS);
    renderApplicant();
    restoreDraft(APPLICANT_FIELD_IDS, draft);
    const dateInput = document.getElementById('L-theDate');
    const submitBtn = document.getElementById('L-submitBtn');
    const ack = document.getElementById('L-ackCheck');
    if(submitBtn && ack) submitBtn.disabled = !ack.checked;
    if(dateInput) dateInput.dispatchEvent(new Event('change'));
    if(window.__leaveRenderCal) window.__leaveRenderCal();
    setTimeout(celebrateUnseenLeave, 300);
  } else {
    const draft = captureDraft(ADMIN_FIELD_IDS);
    renderAdmin();
    restoreDraft(ADMIN_FIELD_IDS, draft);
  }
  animateBalance();
}

if(stateRef){
  stateRef.on('value', (snapshot)=>{
    loadError = null;
    const val = snapshot.val();
    if(val && typeof val === 'object'){
      state = Object.assign(defaultState(), val);
      state.requests = Array.isArray(val.requests) ? val.requests : [];
      state.history = Array.isArray(val.history) ? val.history : [];
      applyYearRollover();
    } else {
      state = defaultState();
      saveState();
    }
    refreshCurrentView();
  }, (err)=>{
    console.error(err);
    loadError = '데이터베이스 접근이 거부됐어요 (권한 오류). Firebase Realtime Database 규칙이 게시(Publish)되어 있는지 확인해주세요. 원본 오류: ' + (err.message || String(err));
    refreshCurrentView();
  });
}

setTimeout(()=>{
  if(!state){
    loadError = loadError || 'Firebase 연결이 6초 넘게 응답이 없어요. firebaseConfig 값, 네트워크 연결, Realtime Database 규칙 게시 여부를 확인해주세요.';
    refreshCurrentView();
  }
}, 6000);

function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}
function fmtReq(item){
  return `${fmtDate(item.date)} ${item.startTime}~${item.endTime}`;
}
function describeTrip(item){
  return `📍 ${escapeHTML(item.place)} · 👥 ${escapeHTML(item.companion)}`;
}
const WORKDAY_HOURS = 5; // 유흥연차 1일 = 5시간

function hoursToDays(hours){
  let d = Math.round((hours / WORKDAY_HOURS) * 2) / 2; // 0.5일 단위로 반올림
  if(d > 1) d = 1;
  return d;
}
function timeRangeHours(startTime, endTime){
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  const startMin = sh*60 + sm;
  const endMin = eh*60 + em;
  if(endMin <= startMin) return 0;
  return (endMin - startMin) / 60;
}
function isWeekend(date){
  const d = new Date(date+"T00:00:00").getDay();
  return d === 0 || d === 6;
}
function touchesBlackout(date){
  const m = new Date(date+"T00:00:00").getMonth();
  return BLACKOUT_MONTHS.includes(m);
}
function uid(){ return 'r'+Date.now()+Math.random().toString(36).slice(2,7); }
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

        <input type="hidden" id="L-theDate">
        <div class="cal" id="L-cal"></div>
      </div>
      <div class="field">
        <label>시간</label>
        <div class="row2">
          <div><input type="time" id="L-startTime" value="09:00"></div>
          <div><input type="time" id="L-endTime" value="14:00"></div>
        </div>
      </div>
      <div class="field">
        <span class="days-badge" id="L-daysBadge">0일</span>
        <div class="warn-text" id="L-warnText"></div>
      </div>
      <div class="field">
        <label>어디를 갈 건가요?</label>
        <input type="text" id="L-place" placeholder="예) 강남역 포차거리">
      </div>
      <div class="field">
        <label>누구와 갈 건가요?</label>
        <input type="text" id="L-companion" placeholder="예) 대학 동기들">
      </div>
      <div class="field">
        <label>준수사항</label>
        <div class="rules-box">
          ${RULES.map(r=>`<div class="rule-line">${escapeHTML(r)}</div>`).join('')}
        </div>
        <label class="ack-label">
          <input type="checkbox" id="L-ackCheck"> 위 준수사항을 모두 확인했습니다
        </label>
      </div>
      <button class="action btn-primary" id="L-submitBtn" disabled>신청서 제출</button>
      ${(function(){
        const last = state.requests.filter(r=>r.status!=='rejected')
          .sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))[0];
        if(!last) return '';
        return `<button class="repeat-btn" id="L-repeatBtn">↻ 지난번처럼 (${escapeHTML(last.place||'')})</button>`;
      })()}
    </div>

    <div class="card">
      <h2>내 신청 내역</h2>
      <div id="L-myList"></div>
      <div class="actions" id="L-myListActions" style="display:none; margin-top:10px;">
        <button class="action btn-ghost" id="L-cancelSelectedBtn">선택 취소</button>
        <button class="action btn-reject" id="L-cancelAllBtn">모두 취소하기</button>
      </div>
    </div>
  `;

  const dateInput = document.getElementById('L-theDate');
  const startT = document.getElementById('L-startTime');
  const endT = document.getElementById('L-endTime');
  const badge = document.getElementById('L-daysBadge');
  const warnText = document.getElementById('L-warnText');
  const submitBtn = document.getElementById('L-submitBtn');
  const ackCheck = document.getElementById('L-ackCheck');

  function refreshSubmitState(){
    submitBtn.disabled = !ackCheck.checked;
  }
  ackCheck.addEventListener('change', refreshSubmitState);

  function validate(){
    const d = dateInput.value;
    const hours = timeRangeHours(startT.value, endT.value);
    if(hours <= 0){
      badge.textContent = '0일';
      warnText.textContent = '종료 시간이 시작 시간보다 늦어야 해요.';
      return;
    }
    if(hours > MAX_HOURS_PER_DAY){
      badge.textContent = `${hours}시간`;
      warnText.textContent = `1일 최대 ${MAX_HOURS_PER_DAY}시간까지만 신청할 수 있어요.`;
      return;
    }
    const days = hoursToDays(hours);
    badge.textContent = `${days}일 (${hours}시간)`;
    if(!d){ warnText.textContent=''; return; }
    if(touchesBlackout(d)){
      warnText.textContent = '6·7·8월에는 유흥연차를 사용할 수 없어요.';
    } else if(days > state.balance){
      warnText.textContent = `보유 유흥연차(${state.balance}일)보다 많아요.`;
    } else {
      warnText.textContent = '';
    }
  }
  // ── 달력 ──
  let calYear, calMonth;
  (function initCal(){
    const now = new Date();
    const cur = dateInput.value ? new Date(dateInput.value+'T00:00:00') : now;
    calYear = cur.getFullYear(); calMonth = cur.getMonth();
  })();

  function renderCal(){
    const box = document.getElementById('L-cal');
    if(!box) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth+1, 0).getDate();
    const blocked = BLACKOUT_MONTHS.includes(calMonth);

    // 과거 달로는 못 가게
    const atStart = (calYear === today.getFullYear() && calMonth <= today.getMonth());

    let h = '<div class="cal-head">'+
      '<button type="button" id="L-calPrev" '+(atStart?'disabled':'')+'>‹</button>'+
      '<span class="mon">'+calYear+'년 '+(calMonth+1)+'월</span>'+
      '<button type="button" id="L-calNext">›</button>'+
    '</div><div class="cal-grid">';
    ['일','월','화','수','목','금','토'].forEach((d,i)=>{
      h += '<div class="dow'+(i===0?' sun':i===6?' sat':'')+'">'+d+'</div>';
    });
    for(let i=0;i<first;i++) h += '<div></div>';
    for(let d=1; d<=days; d++){
      const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow = new Date(calYear, calMonth, d).getDay();
      const isPast = key < todayStr;
      const dis = blocked || isPast;
      const cls = ['cal-day'];
      if(dow===0) cls.push('sun');
      if(dow===6) cls.push('sat');
      if(key===todayStr) cls.push('today');
      if(key===dateInput.value) cls.push('picked');
      h += '<button type="button" class="'+cls.join(' ')+'" data-date="'+key+'" '+(dis?'disabled':'')+'>'+d+'</button>';
    }
    h += '</div>';
    if(blocked) h += '<div class="cal-note">6·7·8월에는 유흥연차를 사용할 수 없어요</div>';
    box.innerHTML = h;

    const prev = document.getElementById('L-calPrev');
    const next = document.getElementById('L-calNext');
    if(prev) prev.addEventListener('click', ()=>{
      calMonth--; if(calMonth<0){ calMonth=11; calYear--; }
      renderCal();
    });
    if(next) next.addEventListener('click', ()=>{
      calMonth++; if(calMonth>11){ calMonth=0; calYear++; }
      renderCal();
    });
    box.querySelectorAll('.cal-day[data-date]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        dateInput.value = btn.dataset.date;
        FX.haptic(10);
        renderCal();
        validate();
      });
    });
  }
  renderCal();
  window.__leaveRenderCal = renderCal;

  const lRepeat = document.getElementById('L-repeatBtn');
  if(lRepeat){
    lRepeat.addEventListener('click', ()=>{
      const last = state.requests.filter(r=>r.status!=='rejected')
        .sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))[0];

      if(last.startTime) startT.value = last.startTime;
      if(last.endTime) endT.value = last.endTime;
      document.getElementById('L-place').value = last.place || '';
      document.getElementById('L-companion').value = last.companion || '';
      validate();
      FX.haptic(10);
      FX.toast('지난번 내용을 불러왔어요');
    });
  }

  dateInput.addEventListener('change', validate);
  startT.addEventListener('change', validate);
  endT.addEventListener('change', validate);

  refreshSubmitState();

  submitBtn.addEventListener('click', async ()=>{

    const d = dateInput.value;
    if(!d){ FX.alert('날짜를 입력해주세요.'); return; }
    const hours = timeRangeHours(startT.value, endT.value);
    if(hours <= 0){ FX.alert('종료 시간이 시작 시간보다 늦어야 해요.'); return; }
    if(hours > MAX_HOURS_PER_DAY){ FX.alert(`1일 최대 ${MAX_HOURS_PER_DAY}시간까지만 신청할 수 있어요.`); return; }
    if(touchesBlackout(d)){ FX.alert('6·7·8월에는 유흥연차를 사용할 수 없어요.'); return; }
    const days = hoursToDays(hours);
    if(days > state.balance){ FX.alert(`보유 유흥연차(${state.balance}일)보다 많이 신청할 수 없어요.`); return; }
    const place = document.getElementById('L-place').value.trim();
    const companion = document.getElementById('L-companion').value.trim();
    if(!place){ FX.alert('어디를 갈 건지 입력해주세요.'); return; }
    if(!companion){ FX.alert('누구와 갈 건지 입력해주세요.'); return; }

    submitBtn.disabled = true; submitBtn.textContent = '제출 중...';
    state.requests.push({
      id: uid(), date: d, startTime: startT.value, endTime: endT.value, days, place, companion,
      status: 'pending', comment: '', submittedAt: new Date().toISOString(),
      decidedAt: null
    });
    await saveState();
    notifyTelegram(CHAT_ID_구마구마, `🐰 이토끼님이 유흥연차 신청했어요: ${d} ${startT.value}~${endT.value} (${days}일) — ${place} / ${companion}. 결재 부탁해요!`);
    submitBtn.textContent = '신청서 제출';
    document.getElementById('L-place').value='';
    document.getElementById('L-companion').value='';
    ackCheck.checked = false;
    refreshSubmitState();
    warnText.textContent='';
    FX.toast('제출되었어요! 구마구마님의 결재를 기다려주세요');
    renderApplicant();
  });

  const myList = document.getElementById('L-myList');
  const myListActions = document.getElementById('L-myListActions');
  const statusLabel = {pending:'대기', approved:'승인', rejected:'반려'};
  if(mine.length === 0){
    myList.innerHTML = `<div class="empty">아직 신청 내역이 없어요.</div>`;
    myListActions.style.display = 'none';
  } else {
    myListActions.style.display = 'flex';
    myList.innerHTML = mine.map(item => `
      <div style="display:flex; gap:8px; padding:8px 0; border-bottom:1px dashed var(--pink);">
        <input type="checkbox" class="mine-check" data-id="${item.id}" style="margin-top:4px; width:16px; height:16px; flex-shrink:0;">
        <div style="flex:1;">
          <div class="req-meta">${fmtReq(item)} · ${item.days}일
            ${FX.statusMarkup(item.status)}
          </div>
          <div class="req-reason">${describeTrip(item)}</div>
          ${item.comment ? `<div class="req-meta">반려 사유: ${escapeHTML(item.comment)}</div>` : ''}
          <button class="action btn-ghost" data-my-cancel-id="${item.id}" style="margin-top:4px; padding:5px 10px; font-size:11px;">취소</button>
        </div>
      </div>
    `).join('');
  }

  function cancelMyRequests(ids){
    ids.forEach(id=>{
      const idx = state.requests.findIndex(r=>r.id===id);
      if(idx === -1) return;
      const item = state.requests[idx];
      if(item.status === 'approved'){
        state.balance = Math.round((state.balance + item.days) * 10) / 10;
        state.history.unshift({ note:`이토끼가 신청 취소: ${fmtReq(item)} (${item.days}일 반환)`, at:new Date().toISOString() });
      } else {
        state.history.unshift({ note:`이토끼가 신청 취소: ${fmtReq(item)}`, at:new Date().toISOString() });
      }
      state.requests.splice(idx,1);
    });
  }

  myList.querySelectorAll('button[data-my-cancel-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.confirming !== '1'){
        btn.dataset.confirming = '1';
        btn.textContent = '진짜 취소?';
        setTimeout(()=>{
          if(btn.dataset.confirming === '1'){ btn.dataset.confirming=''; btn.textContent='취소'; }
        }, 4000);
        return;
      }
      cancelMyRequests([btn.dataset.myCancelId]);
      FX.haptic(18);
      const host = btn.closest('div');
      if(host && !FX.reduce){ host.classList.add('vanish'); await new Promise(r=>setTimeout(r,330)); }
      await saveState();
      renderApplicant();
    });
  });

  const cancelSelectedBtn = document.getElementById('L-cancelSelectedBtn');
  const cancelAllBtn = document.getElementById('L-cancelAllBtn');
  if(cancelSelectedBtn){
    cancelSelectedBtn.addEventListener('click', async ()=>{
      const ids = Array.from(myList.querySelectorAll('.mine-check:checked')).map(cb=>cb.dataset.id);
      if(ids.length === 0){ FX.alert('취소할 항목을 먼저 선택해주세요.'); return; }
      if(cancelSelectedBtn.dataset.confirming !== '1'){
        cancelSelectedBtn.dataset.confirming = '1';
        cancelSelectedBtn.textContent = `선택한 ${ids.length}건 진짜 취소?`;
        setTimeout(()=>{
          if(cancelSelectedBtn.dataset.confirming === '1'){ cancelSelectedBtn.dataset.confirming=''; cancelSelectedBtn.textContent='선택 취소'; }
        }, 4000);
        return;
      }
      cancelMyRequests(ids);
      await saveState();
      renderApplicant();
    });
  }
  if(cancelAllBtn){
    cancelAllBtn.addEventListener('click', async ()=>{
      const ids = mine.map(item=>item.id);
      if(cancelAllBtn.dataset.confirming !== '1'){
        cancelAllBtn.dataset.confirming = '1';
        cancelAllBtn.textContent = '전체 진짜 취소?';
        setTimeout(()=>{
          if(cancelAllBtn.dataset.confirming === '1'){ cancelAllBtn.dataset.confirming=''; cancelAllBtn.textContent='모두 취소하기'; }
        }, 4000);
        return;
      }
      cancelMyRequests(ids);
      await saveState();
      renderApplicant();
    });
  }
}

function uid(){ return 'r'+Date.now()+Math.random().toString(36).slice(2,7); }
function compressImage(file, maxWidth=600, quality=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

}
function fmtTime(iso){
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

const APPLICANT_FIELD_IDS = ['S-minutes','S-memo'];
const ADMIN_FIELD_IDS = ['S-pwInput','S-pw1','S-pw2'];

function captureDraft(ids){
  const d = {};
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx) d[id] = (elx.type === 'checkbox') ? elx.checked : elx.value;
  });
  return d;
}
function restoreDraft(ids, d){
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx && d[id] !== undefined){
      if(elx.type === 'checkbox') elx.checked = d[id];
      else elx.value = d[id];
    }
  });
}
function refreshCurrentView(){
  if(view === 'applicant'){
    const draft = captureDraft(APPLICANT_FIELD_IDS);
    renderApplicant();
    restoreDraft(APPLICANT_FIELD_IDS, draft);
    setTimeout(celebrateUnseenSmoke, 300);
  } else {
    const draft = captureDraft(ADMIN_FIELD_IDS);
    renderAdmin();
    restoreDraft(ADMIN_FIELD_IDS, draft);
  }
}

if(stateRef){
  stateRef.on('value', (snapshot)=>{
    loadError = null;
    const val = snapshot.val();
    if(val && typeof val === 'object'){
      state = Object.assign(defaultState(), val);
      state.requests = Array.isArray(val.requests) ? val.requests : [];
      state.history = Array.isArray(val.history) ? val.history : [];
      pruneOldRequests();
    } else {
      state = defaultState();
      saveState();
    }
    refreshCurrentView();
  }, (err)=>{
    console.error(err);
    loadError = '데이터베이스 접근이 거부됐어요 (권한 오류). Firebase Realtime Database 규칙이 게시(Publish)되어 있는지 확인해주세요. 원본 오류: ' + (err.message || String(err));
    refreshCurrentView();
  });
}

setTimeout(()=>{
  if(!state){
    loadError = loadError || 'Firebase 연결이 6초 넘게 응답이 없어요. firebaseConfig 값, 네트워크 연결, Realtime Database 규칙 게시 여부를 확인해주세요.';

}, 6000);

function startTimer(current){
  if(tickInterval) clearInterval(tickInterval);
  if(current.status !== 'approved' || !current.actualStartAt || current.completed) return;
  function tick(){
    const elx = document.getElementById('S-timerNum');
    const labelEl = document.getElementById('S-timerLabel');
    if(!elx) { clearInterval(tickInterval); return; }
    const elapsedSec = Math.floor((Date.now() - new Date(current.actualStartAt).getTime()) / 1000);
    const totalSec = current.minutes * 60;
    const remain = totalSec - elapsedSec;
    if(remain <= 0){
      clearInterval(tickInterval);
      current.actualEndAt = new Date().toISOString();
      current.actualMinutes = current.minutes;
      current.completed = true;
      saveState();
      FX.smoke();
      FX.toast('시간 다 됐어요! 들어가실 시간이에요');
      renderApplicant();
      return;
    }
    const mm = String(Math.floor(remain/60)).padStart(2,'0');
    const ss = String(remain%60).padStart(2,'0');
    elx.textContent = `${mm}:${ss}`;
    labelEl.textContent = '남은 시간';
    // 원형 게이지
    const ring = document.getElementById('S-ringProg');
    const wrap = document.getElementById('S-ringWrap');
    if(ring){
      const C = 477.5;
      ring.style.strokeDashoffset = C * (1 - remain / totalSec);
    }
    if(wrap){
      if(remain <= 60) wrap.classList.add('urgent');
      else wrap.classList.remove('urgent');
    }
    // 초마다 똑딱, 1분 미만이면 맥박
    elx.classList.remove('tick');
    void elx.offsetWidth;
    elx.classList.add('tick');
    if(remain <= 60) elx.classList.add('urgent');
    else elx.classList.remove('urgent');
  }
  tick();
  tickInterval = setInterval(tick, 1000);
}

  function getWeekStart(){
    const now = new Date();
    const day = now.getDay(); // 0=Sun ... 6=Sat
    const diffToMonday = day === 0 ? 6 : day - 1;
    const monday = new Date(now);
    monday.setDate(now.getDate() - diffToMonday);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function weeklyStats(){
    const weekStart = getWeekStart();
    const relevant = state.requests.filter(r=>{
      if(r.status !== 'approved') return false;
      const d = new Date(r.submittedAt);
      if(d < weekStart) return false;
      return true;
    });
    const totalCount = relevant.length;
    const totalMinutes = relevant.reduce((sum,r)=> sum + (r.actualMinutes || r.minutes), 0);
    const avgMinutes = totalCount > 0 ? Math.round((totalMinutes/totalCount)*10)/10 : 0;
    return { totalCount, totalMinutes, avgMinutes };
  }
  const stats = weeklyStats();

  const pending = state.requests.filter(r=>r.status==='pending').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));
  const decided = state.requests.filter(r=>r.status!=='pending').sort((a,b)=>(b.decidedAt||'').localeCompare(a.decidedAt||'')).slice(0,15);
