<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이토끼 유흥연차결재</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --pink:#F9E4E7;
    --pink-deep:#F0C9CF;
    --cream:#FFF8F0;
    --lavender:#C9B7E0;
    --brown:#8B6F5E;
    --ink:#4A3F3B;
    --muted:#A6968D;
    --stamp-red:#D96C7A;
    --stamp-black:#8B7F78;
    --ok:#7BAE7F;
    --warn:#E0A860;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='%23E8B9C0' stroke-width='2.2' opacity='0.55'><ellipse cx='40' cy='26' rx='7' ry='16' transform='rotate(-12 40 26)'/><ellipse cx='58' cy='26' rx='7' ry='16' transform='rotate(12 58 26)'/><circle cx='49' cy='46' r='14'/><circle cx='43' cy='44' r='1.6' fill='%23E8B9C0'/><circle cx='55' cy='44' r='1.6' fill='%23E8B9C0'/><path d='M49 49 q-3 4 -6 1 M49 49 q3 4 6 1' /></g><g fill='none' stroke='%23D9C4E8' stroke-width='2' opacity='0.4'><ellipse cx='95' cy='90' rx='6' ry='13' transform='rotate(-10 95 90)'/><ellipse cx='109' cy='90' rx='6' ry='13' transform='rotate(10 109 90)'/><circle cx='102' cy='106' r='11'/></g></svg>");
    background-size:120px 120px;
    min-height:100vh;
  }
  .script{font-family:'Gaegu',cursive;}
  header{
    background:linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    padding:22px 20px 20px;
    border-bottom:3px dashed var(--lavender);
    text-align:center;
  }
  h1{
    font-family:'Gaegu',cursive; font-size:26px; margin:0; color:var(--ink); font-weight:700;
  }
  .sub{font-size:12px; color:var(--brown); margin-top:5px; letter-spacing:.02em;}

  .switch{
    display:flex; max-width:380px; margin:16px auto 0; padding:0 16px; gap:8px;
  }
  .switch button{
    flex:1; padding:10px 8px; border-radius:20px; border:2px solid var(--lavender);
    background:#fff; color:var(--brown); font-family:'Gaegu',cursive; font-size:15px; font-weight:700;
    cursor:pointer;
  }
  .switch button.active{ background:var(--lavender); color:#fff; border-color:var(--lavender); }

  main{max-width:420px; margin:0 auto; padding:16px 16px 60px;}

  .card{
    background:#fffdfb; border:2px solid var(--pink-deep); border-radius:16px;
    padding:16px; margin-bottom:14px; box-shadow:0 2px 0 var(--pink-deep);
  }
  .card h2{font-family:'Gaegu',cursive; font-size:18px; margin:0 0 10px; color:var(--ink);}

  .balance-hero{
    text-align:center; padding:18px 10px;
  }
  .balance-num{
    font-family:'Gaegu',cursive; font-size:44px; color:var(--brown); font-weight:700; line-height:1;
  }
  .balance-label{font-size:12px; color:var(--muted); margin-top:4px;}
  .rule-note{
    font-size:11.5px; color:var(--brown); background:var(--pink); border-radius:10px;
    padding:8px 10px; margin-top:10px; line-height:1.6;
  }

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--brown); margin-bottom:5px; font-weight:600;}
  .field input, .field textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--pink-deep); border-radius:10px;
    font-family:'Noto Sans KR',sans-serif; font-size:14px; background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .row2{display:flex; gap:8px;}
  .row2 > div{flex:1;}

  .days-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--brown);
    background:var(--pink); border:1px dashed var(--lavender); padding:6px 10px; border-radius:10px;
  }
  .warn-text{ font-size:12px; color:#B5542F; margin-top:6px; }

  button.action{
    font-family:'Noto Sans KR',sans-serif; font-weight:600; font-size:13px;
    border:none; padding:10px 16px; border-radius:20px; cursor:pointer; color:#fff;
  }
  .btn-primary{ background:var(--lavender); width:100%; }
  .btn-primary:disabled{ background:#D8CFE0; cursor:not-allowed; }
  .btn-approve{ background:var(--ok); }
  .btn-reject{ background:var(--stamp-black); }
  .btn-small{ background:var(--brown); font-size:12px; padding:7px 12px; }

  .req-meta{font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .req-reason{font-size:14px; margin:6px 0 10px; line-height:1.5;}
  .rules-box{
    background:var(--pink); border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .rule-line{ font-size:12px; color:var(--brown); line-height:1.7; }
  .ack-label{
    display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink);
    font-weight:600; cursor:pointer;
  }
  .ack-label input{ width:16px; height:16px; }
  .status{
    font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; margin-left:6px;
  }
  .status.pending{background:#FBE9C7; color:#96702A;}
  .status.approved{background:#DFF0DF; color:var(--ok);}
  .status.rejected{background:#EDE8E4; color:var(--stamp-black);}

  .stamp-wrap{ position:relative; display:inline-block; }
  .stamp{
    position:absolute; top:-6px; right:-40px; width:44px; height:44px; border-radius:50%;
    border:2.5px solid var(--stamp-red); color:var(--stamp-red);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px;
    transform:rotate(-14deg) scale(0); opacity:0;
    animation:stampIn .4s ease-out forwards;
  }
  .stamp.reject{ border-color:var(--stamp-black); color:var(--stamp-black); }
  @keyframes stampIn{
    0%{transform:rotate(-14deg) scale(2.8); opacity:0;}
    60%{transform:rotate(-14deg) scale(0.85); opacity:1;}
    80%{transform:rotate(-11deg) scale(1.08);}
    100%{transform:rotate(-11deg) scale(1); opacity:1;}
  }

  .actions{display:flex; gap:8px; margin-top:10px;}
  .empty{ text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; }
  .lock-msg{ text-align:center; padding:20px 10px; color:var(--brown); font-size:13px; line-height:1.7; }

  .history-item{ font-size:12.5px; color:var(--brown); padding:6px 0; border-bottom:1px dashed var(--pink); }
  .history-item:last-child{ border-bottom:none; }

  .link-btn{
    background:none; border:none; color:var(--lavender); font-size:12px; text-decoration:underline;
    cursor:pointer; padding:0; margin-top:8px;
  }
  .bunny-tag{ font-size:12px; color:var(--muted); text-align:center; margin-top:2px; }
</style>
</head>
<body>

<header>
  <h1>🐰 이토끼의 유흥연차결재</h1>
  <div class="sub">신청인: 이토끼 &nbsp;/&nbsp; 결재권자: 구마구마</div>
</header>

<div class="switch">
  <button id="btnApplicant" class="active">신청인</button>
  <button id="btnAdmin">관리자</button>
</div>

<main>
  <div id="view-applicant"></div>
  <div id="view-admin" style="display:none"></div>
</main>

<script>
const ANNUAL_GRANT = 2;
const BLACKOUT_MONTHS = [5,6,7]; // 0-indexed: 6,7,8월
const MAX_BONUS = 1;
const MAX_HOURS_PER_DAY = 5;
const RULES = [
  "가. 과음하지 않고 적당히 즐긴다.",
  "나. 귀가는 안전하게 한다 (택시 이용예상)",
  "다. 다음날 업무(또는 일상생활)에 지장을 주지 않는다.",
  "라. 매번 휴가 사용시 결재권자의 허가를 받는다.",
  "마. 복장은 휴가 전 결재권자의 허가를 받는다."
];

// ⚠️ 아래 firebaseConfig를 본인 Firebase 프로젝트 값으로 바꿔주세요.
// Firebase 콘솔 > 프로젝트 설정 > 일반 > "내 앱" 섹션에서 config를 복사할 수 있어요.
// Realtime Database를 "테스트 모드"로 만들어야 읽기/쓰기가 됩니다.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const stateRef = firebase.database().ref('leave_app_v2');

let state = null;
let loadError = null;
let adminUnlocked = false;
let view = 'applicant';

function todayYear(){ return new Date().getFullYear(); }

function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}

function defaultState(){
  return {
    adminPasswordHash: null,
    balance: 2.5,
    lastResetYear: todayYear(),
    requests: [],
    history: [
      { note: "초기 보유 유흥연차 2.5일", at: new Date().toISOString() }
    ]
  };
}

async function saveState(){
  try{
    await stateRef.set(state);
  }catch(e){
    console.error(e);
    alert("저장에 실패했어요. 인터넷 연결을 확인해주세요.");
  }
}

function applyYearRollover(){
  const y = todayYear();
  if(state.lastResetYear < y){
    state.balance = ANNUAL_GRANT;
    state.history.unshift({
      note: `${y}년 유흥연차 갱신: ${ANNUAL_GRANT}일 부여 (전년도 미사용분은 이월되지 않음)`,
      at: new Date().toISOString()
    });
    state.lastResetYear = y;
    saveState();
  }
}

/* 실시간 동기화: 다른 기기에서 신청/결재하면 자동으로 화면이 갱신됨 */
const APPLICANT_FIELD_IDS = ['theDate','startTime','endTime','place','companion','ackCheck'];
const ADMIN_FIELD_IDS = ['bonusAmount','bonusReason','pwInput','pw1','pw2'];

function captureDraft(ids){
  const d = {};
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx) d[id] = (elx.type === 'checkbox') ? elx.checked : elx.value;
  });
  return d;
}
function restoreDraft(ids, d){
  ids.forEach(id=>{
    const elx = document.getElementById(id);
    if(elx && d[id] !== undefined){
      if(elx.type === 'checkbox') elx.checked = d[id];
      else elx.value = d[id];
    }
  });
}
function refreshCurrentView(){
  if(view === 'applicant'){
    const draft = captureDraft(APPLICANT_FIELD_IDS);
    renderApplicant();
    restoreDraft(APPLICANT_FIELD_IDS, draft);
    const dateInput = document.getElementById('theDate');
    const submitBtn = document.getElementById('submitBtn');
    const ack = document.getElementById('ackCheck');
    if(submitBtn && ack) submitBtn.disabled = !ack.checked;
    if(dateInput) dateInput.dispatchEvent(new Event('change'));
  } else {
    const draft = captureDraft(ADMIN_FIELD_IDS);
    renderAdmin();
    restoreDraft(ADMIN_FIELD_IDS, draft);
  }
}

stateRef.on('value', (snapshot)=>{
  loadError = null;
  const val = snapshot.val();
  if(val){
    state = val;
    applyYearRollover();
  } else {
    state = defaultState();
    saveState();
  }
  refreshCurrentView();
}, (err)=>{
  console.error(err);
  loadError = err.message || String(err);
  refreshCurrentView();
});

setTimeout(()=>{
  if(!state){
    loadError = loadError || 'Firebase 연결이 안 되고 있어요. index.html 상단의 firebaseConfig 값이 비어있거나(YOUR_API_KEY 등) 잘못된 건 아닌지 확인해주세요.';
    refreshCurrentView();
  }
}, 6000);

function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}
function fmtReq(item){
  return `${fmtDate(item.date)} ${item.startTime}~${item.endTime}`;
}
function describeTrip(item){
  return `📍 ${escapeHTML(item.place)} · 👥 ${escapeHTML(item.companion)}`;
}
const WORKDAY_HOURS = 5; // 유흥연차 1일 = 5시간

function hoursToDays(hours){
  let d = Math.round((hours / WORKDAY_HOURS) * 2) / 2; // 0.5일 단위로 반올림
  if(d > 1) d = 1;
  return d;
}
function timeRangeHours(startTime, endTime){
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  const startMin = sh*60 + sm;
  const endMin = eh*60 + em;
  if(endMin <= startMin) return 0;
  return (endMin - startMin) / 60;
}
function isWeekend(date){
  const d = new Date(date+"T00:00:00").getDay();
  return d === 0 || d === 6;
}
function touchesBlackout(date){
  const m = new Date(date+"T00:00:00").getMonth();
  return BLACKOUT_MONTHS.includes(m);
}
function uid(){ return 'r'+Date.now()+Math.random().toString(36).slice(2,7); }
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------------- 신청인 뷰 ---------------- */
function renderApplicant(){
  const el = document.getElementById('view-applicant');
  if(!state){
    el.innerHTML = loadError
      ? `<div class="empty">불러오기 실패 😢<br><span style="font-size:11px">${escapeHTML(loadError)}</span></div>`
      : '<div class="empty">불러오는 중... 🐰</div>';
    return;
  }
  const pending = state.requests.filter(r=>r.status==='pending');
  const mine = state.requests.slice().sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));

  el.innerHTML = `
    <div class="card balance-hero">
      <div class="balance-num">${state.balance}<span style="font-size:18px">일</span></div>
      <div class="balance-label">이토끼의 보유 유흥연차</div>
      <div class="rule-note">🐰 6·7·8월은 유흥연차를 쓸 수 없어요<br>매년 1월 ${ANNUAL_GRANT}일이 새로 채워지고, 남은 유흥연차는 다음 해로 이월되지 않아요</div>
    </div>

    <div class="card">
      <h2>유흥연차 신청하기</h2>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="theDate">
      </div>
      <div class="field">
        <label>시간</label>
        <div class="row2">
          <div><input type="time" id="startTime" value="09:00"></div>
          <div><input type="time" id="endTime" value="14:00"></div>
        </div>
      </div>
      <div class="field">
        <span class="days-badge" id="daysBadge">0일</span>
        <div class="warn-text" id="warnText"></div>
      </div>
      <div class="field">
        <label>어디를 갈 건가요?</label>
        <input type="text" id="place" placeholder="예) 강남역 포차거리">
      </div>
      <div class="field">
        <label>누구와 갈 건가요?</label>
        <input type="text" id="companion" placeholder="예) 대학 동기들">
      </div>
      <div class="field">
        <label>준수사항</label>
        <div class="rules-box">
          ${RULES.map(r=>`<div class="rule-line">${escapeHTML(r)}</div>`).join('')}
        </div>
        <label class="ack-label">
          <input type="checkbox" id="ackCheck"> 위 준수사항을 모두 확인했습니다
        </label>
      </div>
      <button class="action btn-primary" id="submitBtn" disabled>신청서 제출</button>
    </div>

    <div class="card">
      <h2>내 신청 내역</h2>
      <div id="myList"></div>
      <div class="actions" id="myListActions" style="display:none; margin-top:10px;">
        <button class="action btn-ghost" id="cancelSelectedBtn">선택 취소</button>
        <button class="action btn-reject" id="cancelAllBtn">모두 취소하기</button>
      </div>
    </div>
  `;

  const dateInput = document.getElementById('theDate');
  const startT = document.getElementById('startTime');
  const endT = document.getElementById('endTime');
  const badge = document.getElementById('daysBadge');
  const warnText = document.getElementById('warnText');
  const submitBtn = document.getElementById('submitBtn');
  const ackCheck = document.getElementById('ackCheck');

  function refreshSubmitState(){
    submitBtn.disabled = !ackCheck.checked;
  }
  ackCheck.addEventListener('change', refreshSubmitState);

  function validate(){
    const d = dateInput.value;
    const hours = timeRangeHours(startT.value, endT.value);
    if(hours <= 0){
      badge.textContent = '0일';
      warnText.textContent = '종료 시간이 시작 시간보다 늦어야 해요.';
      return;
    }
    if(hours > MAX_HOURS_PER_DAY){
      badge.textContent = `${hours}시간`;
      warnText.textContent = `1일 최대 ${MAX_HOURS_PER_DAY}시간까지만 신청할 수 있어요.`;
      return;
    }
    const days = hoursToDays(hours);
    badge.textContent = `${days}일 (${hours}시간)`;
    if(!d){ warnText.textContent=''; return; }
    if(isWeekend(d)){
      warnText.textContent = '주말에는 신청할 필요 없어요.';
    } else if(touchesBlackout(d)){
      warnText.textContent = '6·7·8월에는 유흥연차를 사용할 수 없어요.';
    } else if(days > state.balance){
      warnText.textContent = `보유 유흥연차(${state.balance}일)보다 많아요.`;
    } else {
      warnText.textContent = '';
    }
  }
  dateInput.addEventListener('change', validate);
  startT.addEventListener('change', validate);
  endT.addEventListener('change', validate);
  validate();
  refreshSubmitState();

  submitBtn.addEventListener('click', async ()=>{
    if(!ackCheck.checked){ alert('준수사항을 확인해주세요.'); return; }
    const d = dateInput.value;
    if(!d){ alert('날짜를 입력해주세요.'); return; }
    if(isWeekend(d)){ alert('주말에는 신청할 필요 없어요.'); return; }
    const hours = timeRangeHours(startT.value, endT.value);
    if(hours <= 0){ alert('종료 시간이 시작 시간보다 늦어야 해요.'); return; }
    if(hours > MAX_HOURS_PER_DAY){ alert(`1일 최대 ${MAX_HOURS_PER_DAY}시간까지만 신청할 수 있어요.`); return; }
    if(touchesBlackout(d)){ alert('6·7·8월에는 유흥연차를 사용할 수 없어요.'); return; }
    const days = hoursToDays(hours);
    if(days > state.balance){ alert(`보유 유흥연차(${state.balance}일)보다 많이 신청할 수 없어요.`); return; }
    const place = document.getElementById('place').value.trim();
    const companion = document.getElementById('companion').value.trim();
    if(!place){ alert('어디를 갈 건지 입력해주세요.'); return; }
    if(!companion){ alert('누구와 갈 건지 입력해주세요.'); return; }

    submitBtn.disabled = true; submitBtn.textContent = '제출 중...';
    state.requests.push({
      id: uid(), date: d, startTime: startT.value, endTime: endT.value, days, place, companion,
      status: 'pending', comment: '', submittedAt: new Date().toISOString(),
      decidedAt: null
    });
    await saveState();
    submitBtn.textContent = '신청서 제출';
    document.getElementById('place').value='';
    document.getElementById('companion').value='';
    ackCheck.checked = false;
    refreshSubmitState();
    warnText.textContent='';
    alert('제출되었어요! 구마구마님의 결재를 기다려주세요 🐰');
    renderApplicant();
  });

  const myList = document.getElementById('myList');
  const myListActions = document.getElementById('myListActions');
  const statusLabel = {pending:'대기', approved:'승인', rejected:'반려'};
  if(mine.length === 0){
    myList.innerHTML = `<div class="empty">아직 신청 내역이 없어요.</div>`;
    myListActions.style.display = 'none';
  } else {
    myListActions.style.display = 'flex';
    myList.innerHTML = mine.map(item => `
      <div style="display:flex; gap:8px; padding:8px 0; border-bottom:1px dashed var(--pink);">
        <input type="checkbox" class="mine-check" data-id="${item.id}" style="margin-top:4px; width:16px; height:16px; flex-shrink:0;">
        <div style="flex:1;">
          <div class="req-meta">${fmtReq(item)} · ${item.days}일
            <span class="status ${item.status}">${statusLabel[item.status]}</span>
          </div>
          <div class="req-reason">${describeTrip(item)}</div>
          ${item.comment ? `<div class="req-meta">반려 사유: ${escapeHTML(item.comment)}</div>` : ''}
          <button class="action btn-ghost" data-my-cancel-id="${item.id}" style="margin-top:4px; padding:5px 10px; font-size:11px;">취소</button>
        </div>
      </div>
    `).join('');
  }

  function cancelMyRequests(ids){
    ids.forEach(id=>{
      const idx = state.requests.findIndex(r=>r.id===id);
      if(idx === -1) return;
      const item = state.requests[idx];
      if(item.status === 'approved'){
        state.balance = Math.round((state.balance + item.days) * 10) / 10;
        state.history.unshift({ note:`이토끼가 신청 취소: ${fmtReq(item)} (${item.days}일 반환)`, at:new Date().toISOString() });
      } else {
        state.history.unshift({ note:`이토끼가 신청 취소: ${fmtReq(item)}`, at:new Date().toISOString() });
      }
      state.requests.splice(idx,1);
    });
  }

  myList.querySelectorAll('button[data-my-cancel-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.confirming !== '1'){
        btn.dataset.confirming = '1';
        btn.textContent = '진짜 취소?';
        setTimeout(()=>{
          if(btn.dataset.confirming === '1'){ btn.dataset.confirming=''; btn.textContent='취소'; }
        }, 4000);
        return;
      }
      cancelMyRequests([btn.dataset.myCancelId]);
      await saveState();
      renderApplicant();
    });
  });

  const cancelSelectedBtn = document.getElementById('cancelSelectedBtn');
  const cancelAllBtn = document.getElementById('cancelAllBtn');
  if(cancelSelectedBtn){
    cancelSelectedBtn.addEventListener('click', async ()=>{
      const ids = Array.from(myList.querySelectorAll('.mine-check:checked')).map(cb=>cb.dataset.id);
      if(ids.length === 0){ alert('취소할 항목을 먼저 선택해주세요.'); return; }
      if(cancelSelectedBtn.dataset.confirming !== '1'){
        cancelSelectedBtn.dataset.confirming = '1';
        cancelSelectedBtn.textContent = `선택한 ${ids.length}건 진짜 취소?`;
        setTimeout(()=>{
          if(cancelSelectedBtn.dataset.confirming === '1'){ cancelSelectedBtn.dataset.confirming=''; cancelSelectedBtn.textContent='선택 취소'; }
        }, 4000);
        return;
      }
      cancelMyRequests(ids);
      await saveState();
      renderApplicant();
    });
  }
  if(cancelAllBtn){
    cancelAllBtn.addEventListener('click', async ()=>{
      const ids = mine.map(item=>item.id);
      if(cancelAllBtn.dataset.confirming !== '1'){
        cancelAllBtn.dataset.confirming = '1';
        cancelAllBtn.textContent = '전체 진짜 취소?';
        setTimeout(()=>{
          if(cancelAllBtn.dataset.confirming === '1'){ cancelAllBtn.dataset.confirming=''; cancelAllBtn.textContent='모두 취소하기'; }
        }, 4000);
        return;
      }
      cancelMyRequests(ids);
      await saveState();
      renderApplicant();
    });
  }
}

/* ---------------- 관리자 뷰 ---------------- */
function renderAdmin(){
  const el = document.getElementById('view-admin');
  if(!state){
    el.innerHTML = loadError
      ? `<div class="empty">불러오기 실패 😢<br><span style="font-size:11px">${escapeHTML(loadError)}</span></div>`
      : '<div class="empty">불러오는 중... 🐰</div>';
    return;
  }

  if(!state.adminPasswordHash){
    el.innerHTML = `
      <div class="card">
        <h2>🔐 관리자 비밀번호 설정</h2>
        <p style="font-size:13px; color:var(--brown);">처음 사용이시네요! 결재함에 들어갈 비밀번호를 설정해주세요.</p>
        <div class="field"><label>비밀번호</label><input type="password" id="pw1"></div>
        <div class="field"><label>비밀번호 확인</label><input type="password" id="pw2"></div>
        <button class="action btn-primary" id="setPwBtn">설정하기</button>
      </div>
    `;
    document.getElementById('setPwBtn').addEventListener('click', async ()=>{
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      if(!p1){ alert('비밀번호를 입력해주세요.'); return; }
      if(p1 !== p2){ alert('비밀번호가 일치하지 않아요.'); return; }
      state.adminPasswordHash = simpleHash(p1);
      await saveState();
      alert('설정 완료! 이제 이 비밀번호로 결재함에 들어올 수 있어요.');
      renderAdmin();
    });
    return;
  }

  if(!adminUnlocked){
    el.innerHTML = `
      <div class="card">
        <h2>🔐 관리자 로그인</h2>
        <div class="field"><label>비밀번호</label><input type="password" id="pwInput"></div>
        <button class="action btn-primary" id="unlockBtn">잠금 해제</button>
        <div class="lock-msg">결재권자 구마구마님만 들어올 수 있어요.</div>
      </div>
    `;
    const tryUnlock = async ()=>{
      const p = document.getElementById('pwInput').value;
      if(simpleHash(p) === state.adminPasswordHash){
        adminUnlocked = true;
        renderAdmin();
      } else {
        alert('비밀번호가 맞지 않아요.');
      }
    };
    document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
    document.getElementById('pwInput').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') tryUnlock(); });
    return;
  }

  const pending = state.requests.filter(r=>r.status==='pending').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));
  const decided = state.requests.filter(r=>r.status!=='pending').sort((a,b)=>(b.decidedAt||'').localeCompare(a.decidedAt||''));

  el.innerHTML = `
    <div class="card balance-hero">
      <div class="balance-num">${state.balance}<span style="font-size:18px">일</span></div>
      <div class="balance-label">이토끼 보유 유흥연차</div>
    </div>

    <div class="card">
      <h2>결재 대기 (${pending.length})</h2>
      <div id="pendingList">${pending.length===0 ? '<div class="empty">대기 중인 신청서가 없어요.</div>' : ''}</div>
    </div>

    <div class="card">
      <h2>🎁 포상 유흥연차 지급</h2>
      <p style="font-size:12px; color:var(--muted); margin-top:-4px;">한 번에 최대 ${MAX_BONUS}일까지 지급할 수 있어요.</p>
      <div class="field">
        <label>지급 일수 (0.5 ~ ${MAX_BONUS})</label>
        <input type="number" id="bonusAmount" min="0.5" max="${MAX_BONUS}" step="0.5" value="0.5">
      </div>
      <div class="field">
        <label>지급 사유</label>
        <input type="text" id="bonusReason" placeholder="예) 프로젝트 마감 고생 포상">
      </div>
      <button class="action btn-approve" id="bonusBtn" style="width:100%;">지급하기</button>
    </div>

    <div class="card">
      <h2>처리 내역</h2>
      <div id="decidedList">${decided.length===0 ? '<div class="empty">아직 처리한 내역이 없어요.</div>' : ''}</div>
    </div>

    <div class="card">
      <h2>활동 로그</h2>
      <div id="historyList"></div>
    </div>

    <button class="link-btn" id="lockBtn">결재함 잠그기</button>
    <button class="link-btn" id="changePwBtn" style="margin-left:12px;">비밀번호 변경</button>
    <button class="link-btn" id="resetBtn" style="margin-left:12px; color:var(--stamp-red);">신청내역 초기화</button>
  `;

  const pendingList = document.getElementById('pendingList');
  pendingList.innerHTML += pending.map(item => `
    <div class="card" data-id="${item.id}" style="margin:10px 0 0;">
      <div class="req-meta">${fmtReq(item)} · ${item.days}일</div>
      <div class="req-reason">${describeTrip(item)}</div>
      <div class="actions">
        <span class="stamp-wrap"><button class="action btn-approve" data-action="approve" data-id="${item.id}">승인</button></span>
        <button class="action btn-reject" data-action="reject" data-id="${item.id}">반려</button>
      </div>
    </div>
  `).join('');

  pendingList.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const item = state.requests.find(r=>r.id===id);
      if(!item) return;
      if(action === 'approve' && item.days > state.balance){
        alert('보유 유흥연차가 부족해서 승인할 수 없어요.');
        return;
      }
      if(action === 'reject'){
        const comment = prompt('반려 사유를 입력해주세요 (선택)') || '';
        item.comment = comment;
      }
      item.status = action === 'approve' ? 'approved' : 'rejected';
      item.decidedAt = new Date().toISOString();
      if(action === 'approve'){
        state.balance = Math.round((state.balance - item.days) * 10) / 10;
        state.history.unshift({ note:`유흥연차 사용 승인: ${fmtReq(item)} (${item.days}일)`, at:item.decidedAt });
      } else {
        state.history.unshift({ note:`유흥연차 신청 반려: ${fmtReq(item)} (${item.days}일)`, at:item.decidedAt });
      }
      const card = pendingList.querySelector(`.card[data-id="${id}"]`);
      card.querySelectorAll('button').forEach(b=>b.disabled=true);
      const stampSpan = card.querySelector('.stamp-wrap');
      if(stampSpan){
        const stamp = document.createElement('div');
        stamp.className = 'stamp' + (action==='reject' ? ' reject' : '');
        stamp.textContent = action==='approve' ? '승인' : '반려';
        stampSpan.appendChild(stamp);
      }
      await saveState();
      setTimeout(renderAdmin, 550);
    });
  });

  const decidedList = document.getElementById('decidedList');
  const statusLabel = {approved:'승인', rejected:'반려'};
  decidedList.innerHTML += decided.map(item => `
    <div class="card" data-decided-id="${item.id}" style="margin:10px 0 0;">
      <div class="req-meta">${fmtReq(item)} · ${item.days}일
        <span class="status ${item.status}">${statusLabel[item.status]}</span>
      </div>
      <div class="req-reason">${describeTrip(item)}</div>
      ${item.comment ? `<div class="req-meta">반려 사유: ${escapeHTML(item.comment)}</div>` : ''}
      <div class="actions">
        <button class="action btn-ghost" data-cancel-id="${item.id}">취소</button>
      </div>
    </div>
  `).join('');

  decidedList.querySelectorAll('button[data-cancel-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.cancelId;
      if(btn.dataset.confirming !== '1'){
        btn.dataset.confirming = '1';
        btn.textContent = '진짜 취소할까요? (다시 누르면 취소됨)';
        setTimeout(()=>{
          if(btn.dataset.confirming === '1'){
            btn.dataset.confirming = '';
            btn.textContent = '취소';
          }
        }, 4000);
        return;
      }
      const item = state.requests.find(r=>r.id===id);
      if(!item) return;
      const wasApproved = item.status === 'approved';
      if(wasApproved){
        state.balance = Math.round((state.balance + item.days) * 10) / 10;
        state.history.unshift({ note:`결재 취소: ${fmtReq(item)} (${item.days}일 반환)`, at:new Date().toISOString() });
      } else {
        state.history.unshift({ note:`반려 취소: ${fmtReq(item)}`, at:new Date().toISOString() });
      }
      item.status = 'pending';
      item.decidedAt = null;
      item.comment = '';
      await saveState();
      renderAdmin();
    });
  });

  const historyList = document.getElementById('historyList');
  historyList.innerHTML = state.history.slice(0,20).map(h => `
    <div class="history-item">${new Date(h.at).toLocaleDateString('ko-KR')} · ${escapeHTML(h.note)}</div>
  `).join('');

  document.getElementById('bonusBtn').addEventListener('click', async ()=>{
    let amt = parseFloat(document.getElementById('bonusAmount').value);
    if(isNaN(amt) || amt <= 0){ alert('지급 일수를 입력해주세요.'); return; }
    if(amt > MAX_BONUS){ alert(`한 번에 최대 ${MAX_BONUS}일까지만 지급할 수 있어요.`); return; }
    const reason = document.getElementById('bonusReason').value.trim();
    state.balance = Math.round((state.balance + amt) * 10) / 10;
    state.history.unshift({ note:`포상 유흥연차 지급: ${amt}일${reason ? ' — '+reason : ''}`, at:new Date().toISOString() });
    await saveState();
    alert(`포상 유흥연차 ${amt}일을 지급했어요! 🎉`);
    renderAdmin();
  });

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    adminUnlocked = false;
    renderAdmin();
  });
  document.getElementById('changePwBtn').addEventListener('click', async ()=>{
    const cur = prompt('현재 비밀번호를 입력해주세요.');
    if(simpleHash(cur||'') !== state.adminPasswordHash){ alert('현재 비밀번호가 맞지 않아요.'); return; }
    const np = prompt('새 비밀번호를 입력해주세요.');
    if(!np){ return; }
    state.adminPasswordHash = simpleHash(np);
    await saveState();
    alert('비밀번호가 변경됐어요.');
  });
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('resetBtn');
    if(btn.dataset.confirming !== '1'){
      btn.dataset.confirming = '1';
      btn.textContent = '진짜 삭제할까요? (다시 누르면 삭제됨)';
      setTimeout(()=>{
        if(btn.dataset.confirming === '1'){
          btn.dataset.confirming = '';
          btn.textContent = '신청내역 초기화';
        }
      }, 4000);
      return;
    }
    btn.dataset.confirming = '';
    state.requests = [];
    state.history.unshift({ note:'신청내역 초기화됨', at:new Date().toISOString() });
    await saveState();
    renderAdmin();
  });
}

/* ---------------- 탭 전환 ---------------- */
document.getElementById('btnApplicant').addEventListener('click', ()=>{
  view = 'applicant';
  document.getElementById('btnApplicant').classList.add('active');
  document.getElementById('btnAdmin').classList.remove('active');
  document.getElementById('view-applicant').style.display = 'block';
  document.getElementById('view-admin').style.display = 'none';
  renderApplicant();
});
document.getElementById('btnAdmin').addEventListener('click', ()=>{
  view = 'admin';
  document.getElementById('btnAdmin').classList.add('active');
  document.getElementById('btnApplicant').classList.remove('active');
  document.getElementById('view-admin').style.display = 'block';
  document.getElementById('view-applicant').style.display = 'none';
  renderAdmin();
});

renderApplicant(); // 첫 화면: Firebase에서 데이터가 오기 전까지 "불러오는 중" 표시
</script>
</body>
</html>
