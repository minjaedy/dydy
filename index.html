    </div>
    <div class="card">
      <h2>처리 내역</h2>
      <div id="S-decidedList">${decided.length===0 ? '<div class="empty">아직 처리한 내역이 없어요.</div>' : ''}</div>
    </div>
    <button class="link-btn" id="S-lockBtn">결재함 잠그기</button>
    <button class="link-btn" id="S-changePwBtn" style="margin-left:12px;">비밀번호 변경</button>
    <button class="link-btn" id="S-resetBtn" style="margin-left:12px; color:var(--stamp-red);">신청내역 초기화</button>
  `;

  const pendingList = document.getElementById('S-pendingList');
  pendingList.innerHTML += pending.map(item => `
    <div class="card glow-wait" data-id="${item.id}" style="margin:10px 0 0;">
      <div class="req-meta">${fmtDateTime(item.submittedAt)} 신청 · ${item.minutes}분</div>
      ${item.memo ? `<div class="req-reason">${escapeHTML(item.memo)}</div>` : ''}
      <div class="actions">
        <span class="stamp-wrap"><button class="action btn-approve" data-action="approve" data-id="${item.id}">승인</button></span>
        <button class="action btn-reject" data-action="reject" data-id="${item.id}">반려</button>
      </div>
    </div>
  `).join('');

  pendingList.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const item = state.requests.find(r=>r.id===id);
      if(!item) return;
      item.status = action === 'approve' ? 'approved' : 'rejected';
      item.decidedAt = new Date().toISOString();
      if(action === 'approve') item.approvedAt = item.decidedAt;
      const card = pendingList.querySelector(`.card[data-id="${id}"]`);
      card.querySelectorAll('button').forEach(b=>b.disabled=true);
      const stampSpan = card.querySelector('.stamp-wrap');
      if(stampSpan){
        const stamp = document.createElement('div');
        stamp.className = 'stamp' + (action==='reject' ? ' reject' : '');
        stamp.textContent = action==='approve' ? '승인' : '반려';
        stampSpan.appendChild(stamp);
        FX.inkSpread(stamp);
        FX.haptic(action==='approve' ? [14, 40, 20] : 26);
        FX.edgeFlash(action==='approve' ? 'rgba(130,200,150,.75)' : 'rgba(190,170,160,.7)');
        setTimeout(function(){ FX.flipCard(card); }, 620);
      }
      await saveState();
      notifyTelegram(CHAT_ID_구마구마, action==='approve'
        ? `✅ 이토끼님이 흡연 ${item.minutes}분 승인했어요. 다녀오세요!`
        : `❌ 이토끼님이 흡연 신청을 반려했어요.`);
      setTimeout(renderAdmin, 550);
    });
  });

  const decidedList = document.getElementById('S-decidedList');
  decidedList.innerHTML += decided.map(item => `
    <div data-decided-id="${item.id}" style="padding:8px 0; border-bottom:1px dashed var(--sky);">
      <div class="req-meta">${fmtDateTime(item.submittedAt)} · ${item.minutes}분${item.actualMinutes ? ` (실제 ${item.actualMinutes}분)` : ''}
        ${FX.statusMarkup(item.status)}
      </div>
      ${item.memo ? `<div class="req-reason">${escapeHTML(item.memo)}</div>` : ''}
      ${item.photo ? `
        <button class="action btn-ghost" data-toggle-photo="${item.id}" style="margin-top:6px; padding:6px 10px; font-size:11px;">📷 인증사진 보기/숨기기</button>
        ${item.photoAt ? `<div class="req-meta" style="margin-top:4px;">📅 ${fmtTime(item.photoAt)} 업로드</div>` : ''}
        <img data-photo-img="${item.id}" src="${item.photo}" style="display:none; width:100%; border-radius:10px; margin-top:8px;">
      ` : ''}
    </div>
  `).join('');

  decidedList.querySelectorAll('button[data-toggle-photo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const img = decidedList.querySelector(`img[data-photo-img="${btn.dataset.togglePhoto}"]`);
      if(img) img.style.display = img.style.display === 'none' ? 'block' : 'none';
    });
  });

  document.getElementById('S-lockBtn').addEventListener('click', ()=>{ adminUnlocked = false; renderAdmin(); });
  document.getElementById('S-changePwBtn').addEventListener('click', async ()=>{
    const cur = await FX.prompt('현재 비밀번호를 입력해주세요.', {title:'비밀번호 변경',label:'현재 비밀번호',type:'password',autocomplete:'current-password',required:true});
    if(cur === null) return;
    if(simpleHash(cur||'') !== state.adminPasswordHash){ FX.alert('현재 비밀번호가 맞지 않아요.'); return; }
    const np = await FX.prompt('새로 사용할 비밀번호를 입력해주세요.', {title:'비밀번호 변경',label:'새 비밀번호',type:'password',autocomplete:'new-password',required:true,confirmLabel:'변경하기'});
    if(!np) return;
    state.adminPasswordHash = simpleHash(np);
    await saveState();
    FX.toast('비밀번호가 변경됐어요.');
  });
  document.getElementById('S-resetBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('S-resetBtn');
    if(btn.dataset.confirming !== '1'){
      btn.dataset.confirming = '1';
      btn.textContent = '진짜 삭제할까요? (다시 누르면 삭제됨)';
      setTimeout(()=>{ if(btn.dataset.confirming==='1'){ btn.dataset.confirming=''; btn.textContent='신청내역 초기화'; } }, 4000);
      return;
    }
    btn.dataset.confirming = '';
    state.requests = [];
    await saveState();
    renderAdmin();
  });
}

/* ---------------- 탭 전환 ---------------- */
document.getElementById('S-btnApplicant').addEventListener('click', ()=>{
  view = 'applicant';
  document.getElementById('S-btnApplicant').classList.add('active');
  document.getElementById('S-btnAdmin').classList.remove('active');
  document.getElementById('S-view-applicant').style.display = 'block';
  document.getElementById('S-view-admin').style.display = 'none';
  renderApplicant();
  setTimeout(celebrateUnseenSmoke, 300);
});
document.getElementById('S-btnAdmin').addEventListener('click', ()=>{
  FX.dismissCharacter();
  view = 'admin';
  document.getElementById('S-btnAdmin').classList.add('active');
  document.getElementById('S-btnApplicant').classList.remove('active');
  document.getElementById('S-view-admin').style.display = 'block';
  document.getElementById('S-view-applicant').style.display = 'none';
  renderAdmin();
});

/* 신청인이 나중에 들어와도 결재 결과 연출을 보여줌 */
function celebrateUnseenSmoke(){
  const isVisible=()=>!!state && view==='applicant' && !document.hidden && document.getElementById('app-smoke').style.display!=='none';
  if(!isVisible() || !state.requests)return;
  const decisions=state.requests.filter(r=>r.status==='approved'||r.status==='rejected').map(r=>({id:r.id,status:r.status,decidedAt:r.decidedAt,scene:r.status==='approved'?'smoke-approve':'smoke-reject'}));
  FX.presentResults('dydy_seen_smoke',decisions,isVisible);
}
window.__smokeShowResults = celebrateUnseenSmoke;
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(celebrateUnseenSmoke, 300); });

window.__smokePending = function(){
  if(!state || !state.requests) return 0;
  return state.requests.filter(r=>r.status==='pending').length;
};

window.__smokeSummary = function(){
  if(!state || !state.requests) return '';
  const today = new Date().toISOString().slice(0,10);
  const list = state.requests.filter(r=>(r.date||(r.submittedAt||'').slice(0,10))===today);
  const done = list.filter(r=>r.status==='approved').length;
  const wait = list.filter(r=>r.status==='pending').length;
  if(!done && !wait) return '';
  let s = '오늘 흡연 ' + done + '회';
  if(wait) s += ' · 대기 ' + wait + '건';
  return s;
};

window.addEventListener('error', (ev)=>{
  const elx = document.getElementById(view === 'admin' ? 'S-view-admin' : 'S-view-applicant');
  if(elx && !state){
    elx.innerHTML = `<div class="empty">오류가 발생했어요 😢<br><span style="font-size:11px">${escapeHTML(ev.message || String(ev.error))}</span></div>`;
  }
});

renderApplicant();

})();
</script>
<script>
  const siteTabLeave = document.getElementById('siteTabLeave');
  const siteTabSmoke = document.getElementById('siteTabSmoke');
  const appLeave = document.getElementById('app-leave');
  const appSmoke = document.getElementById('app-smoke');

  const splash = document.getElementById('siteSplash');
  const splashGlyph = document.getElementById('splashGlyph');
  const splashLabel = document.getElementById('splashLabel');
  let current = 'leave';
  let busy = false;

  const SPLASH_ICONS = FX.ICONS;

  function playSplash(which, label){
    splashGlyph.src = SPLASH_ICONS[which];
    splashLabel.textContent = label;
    splash.classList.remove('show');
    void splash.offsetWidth; // 애니메이션 재시작
    splash.classList.add('show');
  }

  function swapPanel(showEl, hideEl){
    hideEl.style.display = 'none';
    showEl.style.display = 'block';
    showEl.classList.remove('enter');
    void showEl.offsetWidth;
    showEl.classList.add('enter');
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  const switcher = document.getElementById('switcher');
  const topBanner = document.getElementById('topBanner');
  // 세그먼트 아이콘도 스플래시와 같은 이미지 사용
  document.getElementById('segIconLeave').src = SPLASH_ICONS.leave;
  document.getElementById('segIconSmoke').src = SPLASH_ICONS.smoke;

  function setMode(mode){
    switcher.classList.add('moving');
    setTimeout(function(){ switcher.classList.remove('moving'); }, 520);
    switcher.dataset.mode = mode;
    topBanner.dataset.mode = mode;
    siteTabLeave.setAttribute('aria-selected', mode==='leave' ? 'true' : 'false');
    siteTabSmoke.setAttribute('aria-selected', mode==='smoke' ? 'true' : 'false');
  }

  function showLeave(){
    if(busy || current === 'leave') return;
    FX.dismissCharacter();
    busy = true; current = 'leave';
    setMode('leave');
    playSplash('leave', '유흥연차');
    setTimeout(function(){
      swapPanel(appLeave, appSmoke);
      document.title = '이토끼 유흥연차결재';
    }, 230);
    setTimeout(function(){ busy = false; window.__leaveShowResults(); }, 780);
  }

  function showSmoke(){
    if(busy || current === 'smoke') return;
    FX.dismissCharacter();
    busy = true; current = 'smoke';
    setMode('smoke');
    playSplash('smoke', '흡연결재');
    setTimeout(function(){
      swapPanel(appSmoke, appLeave);
      document.title = '흡연시간 결재';
    }, 230);
    setTimeout(function(){ busy = false; window.__smokeShowResults(); }, 780);
  }

  siteTabLeave.addEventListener('click', function(){ FX.haptic(10); showLeave(); });
  siteTabSmoke.addEventListener('click', function(){ FX.haptic(10); showSmoke(); });

  /* ── 첫 로딩 스플래시 ── */
  (function(){
    var btn = document.getElementById('themeBtn');
    var KEY = 'dydy_theme';
    function apply(mode){
      document.documentElement.setAttribute('data-theme', mode);
      var meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', mode==='dark' ? '#1F1B21' : '#FFF6F8');
    }
    var saved = null;
    try{ saved = localStorage.getItem(KEY); }catch(e){}
    apply(saved || 'light');
    btn.addEventListener('click', function(){
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
      btn.classList.remove('flip');
      void btn.offsetWidth;
      btn.classList.add('flip');
      FX.haptic(10);
    });
  })();

  /* ── 새 버전 자동 감지 ── */
  (function(){
    var meta = document.querySelector('meta[name="app-version"]');
    var MY_VERSION = meta ? meta.getAttribute('content') : null;
    if(!MY_VERSION) return;

    function check(){
      if(document.hidden) return;
      fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' })
        .then(function(r){ return r.text(); })
        .then(function(html){
          var m = html.match(/<meta name="app-version" content="([^"]+)"/);
          if(m && m[1] !== MY_VERSION){
            FX.toast('새 버전이 있어요. 잠시 후 새로고침됩니다');
            setTimeout(function(){ location.reload(true); }, 1800);
          }
        })
        .catch(function(){});
    }

    // 앱을 다시 열거나 화면으로 돌아올 때, 그리고 10분마다 확인
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) check();
    });
    setTimeout(check, 3000);
    setInterval(check, 600000);
  })();

  /* ── 오늘 인사 + 요약 (하루 한 번) ── */
  window.updatePendingDots = function(){
    var dl = document.getElementById('dotLeave');
    var ds = document.getElementById('dotSmoke');
    if(dl) dl.style.display = (window.__leavePending && window.__leavePending()) ? 'block' : 'none';
    if(ds) ds.style.display = (window.__smokePending && window.__smokePending()) ? 'block' : 'none';
  };

  window.updateDailyStrip = function(){
    var strip = document.getElementById('dailyStrip');
    var inner = document.getElementById('dailyInner');
    if(!strip || !inner) return;
    var html = '';
    var bits = [];
    if(window.__leaveSummary) bits.push(window.__leaveSummary());
    if(window.__smokeSummary) bits.push(window.__smokeSummary());
    bits = bits.filter(Boolean);
    if(bits.length) html += bits.join(' · ');

    if(html){ inner.innerHTML = html; strip.style.display = 'block'; }
    else strip.style.display = 'none';
  };
  setTimeout(function(){ window.updateDailyStrip(); window.updatePendingDots(); }, 2100);
  setInterval(function(){ if(window.updatePendingDots) window.updatePendingDots(); }, 4000);

  (function(){
    var banner = document.getElementById('topBanner');
    function onScroll(){
      if(window.scrollY > 6) banner.classList.add('scrolled');
      else banner.classList.remove('scrolled');
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  })();

  FX.attachRipple();
  document.getElementById('bootIcon').src = FX.COMBO_ICON;
  (function(){
    var g = document.getElementById('bootGreet');
    if(g) g.textContent = FX.greeting('이토끼, 구마구마');
  })();
  setTimeout(function(){
    var b = document.getElementById('bootSplash');
    if(b) b.remove();
  }, 1850);

  /* ── 당겨서 새로고침 ── */
  (function(){
    var ptr = document.getElementById('ptrIndicator');
    var startY = 0, pulling = false, dist = 0;
    var THRESHOLD = 72;

    document.addEventListener('touchstart', function(e){
      if(window.scrollY > 0 || e.touches.length !== 1) return;
      startY = e.touches[0].clientY; pulling = true; dist = 0;
    }, {passive:true});

    document.addEventListener('touchmove', function(e){
      if(!pulling) return;
      dist = e.touches[0].clientY - startY;
      if(dist <= 0){ ptr.style.opacity = 0; return; }
      if(window.scrollY > 0){ pulling = false; ptr.style.opacity = 0; return; }
      var pct = Math.min(1, dist / THRESHOLD);
      ptr.style.opacity = pct;
      ptr.style.transform = 'translateX(-50%) translateY('+Math.min(dist*0.5, 58)+'px) rotate('+(dist*2.4)+'deg)';
    }, {passive:true});

    document.addEventListener('touchend', function(){
      if(!pulling){ return; }
      pulling = false;
      if(dist >= THRESHOLD){
        ptr.classList.add('spin');
        ptr.style.opacity = 1;
        ptr.style.transform = 'translateX(-50%) translateY(52px)';
        FX.haptic(14);
        setTimeout(function(){ location.reload(); }, 420);
      } else {
        ptr.style.opacity = 0;
        ptr.style.transform = 'translateX(-50%)';
      }
    }, {passive:true});
  })();

  /* ── 이스터에그: 아이콘 5번 연타 ── */
  (function(){
    var taps = 0, timer = null;
    function hit(imgEl){
      taps++;
      clearTimeout(timer);
      timer = setTimeout(function(){ taps = 0; }, 1400);
      if(taps >= 5){
        taps = 0;
        imgEl.classList.remove('egg-spin');
        void imgEl.offsetWidth;
        imgEl.classList.add('egg-spin');
        FX.confetti();
        FX.haptic([12, 50, 12]);
        FX.toast('🥔🐰 구마와 토끼는 오늘도 평화롭습니다');
      }
    }
    siteTabLeave.addEventListener('click', function(){ hit(document.getElementById('segIconLeave')); });
    siteTabSmoke.addEventListener('click', function(){ hit(document.getElementById('segIconSmoke')); });
  })();
</script>
</body>
</html>
